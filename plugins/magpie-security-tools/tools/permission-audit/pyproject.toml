[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "permission-audit"
version = "0.1.0"
description = "Harness-neutral permission audit: auto-detect and audit Claude Code, OpenCode, and future harness settings in one CLI call."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
# Stdlib-only — fast `uv run` resolution + no surprises on a fresh install.
dependencies = []

[project.scripts]
permission-audit = "permission_audit:main"

[tool.hatch.build.targets.wheel]
packages = ["src/permission_audit"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B", "SIM"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
