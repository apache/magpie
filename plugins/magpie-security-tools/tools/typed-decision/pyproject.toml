[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typed-decision"
version = "0.1.0"
description = "Provider-agnostic typed decision tool contract (Choice, Score, Noul) for Apache Magpie with TypeSafe Jev API as first backend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
  "checker",
]

[tool.uv.sources]
checker = { path = "../privacy-llm/checker" }

[tool.hatch.build.targets.wheel]
packages = ["src/typed_decision"]

[tool.ruff]
# Still run by a bare `python3` (a hook, a skill step, or code such a run
# imports), whatever the machine has, so it keeps the 3.11 floor until those
# invocations move to 3.14.
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B", "SIM"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
