[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "checker"
version = "0.1.0"
description = "Approved-LLM gate-check for the apache-magpie privacy-llm tool — parse <project-config>/privacy-llm.md and verify the active LLM stack against the approved-model registry."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# stdlib-only — re + urllib.parse + pathlib + argparse are all that's
# needed. Keeps the gate-check cheap to invoke from skills.
dependencies = []

[project.scripts]
privacy-llm-check = "checker.check:main"

[tool.hatch.build.targets.wheel]
packages = ["src/checker"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B", "SIM", "RUF059"]  # tuple-unpack of (rc, out, err) keeps test sites uniform

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
