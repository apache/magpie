[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magpie-maildir"
version = "0.1.0"
description = "Local Maildir backend for the mail contracts — writes editable outbound drafts (contract:mail-create) and reads a local mbox/Maildir archive (contract:mail-source). Offline, no vendor, no credentials."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
# stdlib-only — composes email.message + mailbox from the standard library.
dependencies = []

[project.scripts]
maildir-draft-create = "maildir_draft.create_draft:main"
maildir-draft-find = "maildir_draft.find_drafts:main"
maildir-source-threads = "maildir_draft.read_archive:threads_main"
maildir-source-read = "maildir_draft.read_archive:read_main"
maildir-source-thread-url = "maildir_draft.read_archive:url_main"

[tool.hatch.build.targets.wheel]
packages = ["src/maildir_draft"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B", "SIM"]  # test clarity beats these

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
