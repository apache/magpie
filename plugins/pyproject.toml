# Config carrier, not a package. `plugins/magpie-<family>/skills/` is a tree of
# agent-facing SKILL.md files; a handful of them ship helper `scripts/` and
# `guards/` written in Python. Before this file existed nothing linted,
# type-checked, or ran them: the workspace checks iterate over
# `[tool.uv.workspace] members` and every member lived under `tools/`, so the
# skill tree was invisible to ruff, mypy, and pytest alike.
#
# It used to sit at `skills/pyproject.toml`, back when that was where the skill
# directories really were. They now live inside the family plugin that ships
# them and `skills/<name>` is a symlink mirroring each one back, so a member
# rooted at `skills/` would have found nothing but symlinks — pytest would have
# collected zero tests and still reported success.
#
# Declaring the tree as one workspace member is the lightest fix that reuses
# the existing machinery — `tools/dev/run-workspace-check.sh` auto-discovers
# which checks apply from the sections below, and `.github/workflows/tests.yml`
# emits a `pytest (plugins)` job for any member with a
# `[tool.pytest.ini_options]` section. Per-skill packaging was the alternative
# and is far heavier: skills are symlinked into adopter repos one directory at
# a time, so build metadata inside each of them would leak into every adopter.
# This file is not symlinked — the relays point at a skill directory, never at
# a plugin root.

[project]
name = "magpie-skills"
version = "0.1.0"
description = "Helper scripts and guards shipped alongside the agent-facing skill definitions in the family plugins."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# stdlib-only — the helper scripts deliberately carry no runtime dependencies
# so an adopter can run them without installing anything.
dependencies = []

# Not an installable package: these are scripts invoked by path from a skill,
# not a library anything imports.
[tool.uv]
package = false

[tool.ruff]
extend = "../tools/dev/shared/ruff.toml"
# Still run by a bare `python3` (a hook, a skill step, or code such a run
# imports), whatever the machine has, so it keeps the 3.11 floor until those
# invocations move to 3.14.
target-version = "py311"
# Generated copies (tools/dev/check-family-plugins.py `copies`) of workspace
# tools, each linted and formatted under its own settings at its source. The
# copies cannot be linted here: their pyproject drops the `extend` of the
# shared base, which does not ship. Same set as mypy's `exclude` below.
extend-exclude = ["magpie-agent-guard/tools", "magpie-vetted-ops/tools", "magpie-security-tools/tools"]

[tool.ruff.lint]
# No annotation requirement here, as mypy had none for this member.
ignore = ["ANN"]

[tool.ty.src]
# The tool copies are generated from workspace members that check themselves
# (same set as ruff's `extend-exclude` above).
exclude = ["magpie-agent-guard/tools/", "magpie-vetted-ops/tools/", "magpie-security-tools/tools/"]

[tool.ty.rules]
# Helper scripts import their siblings by path at run time, which ty cannot
# follow; mypy ran here with `ignore_missing_imports` for the same reason.
import-not-found = "ignore"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
# Collected from the whole tree: tests live next to the skill they cover
# (`magpie-<family>/skills/<name>/tests/`) rather than in one central
# directory. The substrate plugins reach their tool through a symlink out to
# `tools/<name>`, which is its own workspace member with its own pytest job —
# don't collect it twice.
testpaths = ["."]
norecursedirs = [
  "magpie-adversarial-review/tools",
  "magpie-agent-guard/tools",
  "magpie-vetted-ops/tools",
  "magpie-security-tools/tools",
]

[dependency-groups]
# The shared toolchain (mypy, pytest, ruff) comes from `magpie-dev`
# (tools/dev), declared once for the whole workspace. The checks run each tool
# via `uv run --directory <member> --project . python -m <tool>` — see
# tools/dev/run-workspace-check.sh.
dev = ["magpie-dev"]
