# The check names failing on the ten most recently merged upstream PRs:
# pr-management-triage's "is this failure systemic?" sample.
#
# $owner / $repo are supplied by the dispatcher from policy, never by the
# caller, so this query cannot be pointed at another repository.
query($owner: String!, $repo: String!) {
  repository(owner: $owner, name: $repo) {
    pullRequests(states: MERGED, orderBy: {field: UPDATED_AT, direction: DESC}, first: 10) {
      nodes {
        number
        mergedAt
        commits(last: 1) {
          nodes {
            commit {
              oid
              statusCheckRollup {
                contexts(first: 50) {
                  nodes {
                    __typename
                    ... on CheckRun { name conclusion }
                    ... on StatusContext { context state }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
