# Closed and merged upstream PRs since a cutoff date, through the search
# index: the `fast-closed` opt-in of pr-management-stats. The index lags and
# caps results at 1000, so the dashboard marks the series it feeds as
# approximate. `--paginate --slurp`; pageInfo is the only one in the document.
#
# The builder writes `repo:<upstream>` from policy and the validated date
# into $searchQuery itself, so this query cannot be pointed at another
# repository.
query($searchQuery: String!, $endCursor: String) {
  search(query: $searchQuery, type: ISSUE, first: 50, after: $endCursor) {
    pageInfo { hasNextPage endCursor }
    issueCount
    nodes {
      ... on PullRequest {
        number title url isDraft createdAt closedAt mergedAt merged state updatedAt body
        author { login __typename } authorAssociation
        baseRefName
        labels(first: 30) { nodes { name } }
        comments(last: 25) {
          nodes { author { login __typename } authorAssociation createdAt body }
        }
        timelineItems(itemTypes: [CLOSED_EVENT], last: 1) {
          nodes { ... on ClosedEvent { actor { login } } }
        }
      }
    }
  }
}
