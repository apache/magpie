# One page of open, non-draft upstream PRs in the shape pr-stale-sweep
# classifies on, for `gh api graphql --paginate --slurp`. Comments carry the
# raw `body`: the stale-sweep nudge marker is an HTML comment, which
# `bodyText` strips. The search connection's pageInfo is the document's only
# pageInfo, so `gh --paginate` follows it.
#
# The builder writes `repo:<upstream>` from policy into $searchQuery itself,
# so this query cannot be pointed at another repository. The StalePR
# fragment must stay identical to the one in pr-stale-one.graphql (a test
# checks it).
query($searchQuery: String!, $endCursor: String) {
  search(query: $searchQuery, type: ISSUE, first: 25, after: $endCursor) {
    pageInfo { hasNextPage endCursor }
    issueCount
    nodes { ...StalePR }
  }
}

fragment StalePR on PullRequest {
  number
  title
  url
  id
  createdAt
  updatedAt
  isDraft
  body
  mergeable
  baseRefName
  headRefName
  headRefOid
  author { login }
  authorAssociation
  labels(first: 30) { nodes { name } }
  commits(last: 20) {
    totalCount
    nodes { commit { oid committedDate message } }
  }
  head: commits(last: 1) {
    nodes { commit { oid committedDate } }
  }
  reviewThreads(first: 20) {
    totalCount
    nodes {
      isResolved
      comments(last: 3) {
        nodes { author { login } authorAssociation url bodyText createdAt }
      }
    }
  }
  latestReviews(first: 20) {
    nodes { state author { login } authorAssociation submittedAt body }
  }
  comments(last: 20) {
    nodes { author { login } authorAssociation url createdAt body bodyText }
  }
  timelineItems(itemTypes: [LABELED_EVENT, UNLABELED_EVENT], last: 10) {
    nodes {
      __typename
      ... on LabeledEvent { createdAt label { name } }
      ... on UnlabeledEvent { createdAt label { name } }
    }
  }
}
