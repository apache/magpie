# One page (50) of closed and merged upstream PRs, most recently updated
# first, in the pr-management-stats closed shape. This is the default
# (hybrid) closed-PR path: the connection is not the search index, so it is
# neither capped at 1000 nor under-counted. `pr-management stats build`
# stops asking for pages once a page's oldest `updatedAt` predates the cutoff.
#
# $owner / $repo are supplied by the dispatcher from policy, never by the
# caller, so this query cannot be pointed at another repository.
query($owner: String!, $repo: String!, $cursor: String) {
  repository(owner: $owner, name: $repo) {
    pullRequests(states: [CLOSED, MERGED], orderBy: {field: UPDATED_AT, direction: DESC}, first: 50, after: $cursor) {
      pageInfo { hasNextPage endCursor }
      nodes {
        number title url isDraft createdAt closedAt mergedAt merged state updatedAt body
        author { login __typename } authorAssociation
        baseRefName
        labels(first: 30) { nodes { name } }
        comments(last: 25) {
          nodes { author { login __typename } authorAssociation createdAt body }
        }
        timelineItems(itemTypes: [CLOSED_EVENT], last: 1) {
          nodes { ... on ClosedEvent { actor { login } } }
        }
      }
    }
  }
}
