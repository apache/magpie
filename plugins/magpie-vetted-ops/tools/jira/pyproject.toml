[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-bridge"
version = "0.1.0"
description = "JIRA REST bridge: test harness for bridge.groovy, a stdlib Python REST client, and the private-Jira security tracker."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# General-tracker writes live in bridge.groovy. The package ships a stdlib-only REST
# client (jira_bridge.rest) and, on top of it, the security-tracker backend
# (jira_bridge.security_tracker), whose writes go through the same client.
dependencies = []

[project.scripts]
magpie-jira-tracker = "jira_bridge.security_tracker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_bridge"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

# No `[dependency-groups] dev` here: this project also ships inside the
# `magpie-vetted-ops` plugin (vetted-ops runs it as a security-tracker backend
# with `uv run --project <plugin>/tools/<this>`), and `magpie-dev` only resolves
# through the workspace root's `[tool.uv.sources]`, which the plugin does not
# ship — a `dev` group would make every plugin invocation fail. The shared
# toolchain still reaches the tests: CI and the workspace checks sync the root
# `dev` group. See tools/vetted-ops/pyproject.toml.
