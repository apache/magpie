# Magpie's own vetted-ops policy. Magpie self-adopts the framework, so this is
# the live policy the dispatcher reads — see tools/vetted-ops/README.md.
#
# Nothing here widens what an operation can do; it decides which repository the
# fixed operations point at and which caller may run which of them.

# Body files for comment/review operations must resolve inside this directory,
# which must be owned by you and mode 700.
workspace = "~/.cache/apache-magpie/vetted-ops-workspace"

[repos]
# `tracker` is optional and deliberately unset. The value is not derivable from
# this repository, and pointing tracker operations at a *public* repo would
# publish embargoed content, so it is not guessed. Leaving it out costs nothing
# here: no caller below runs a tracker operation, and the ones that address the
# tracker refuse by name if they are ever granted without it.
#
# To enable them, declare it:
#     tracker = "apache/<tracker>"
upstream = "apache/magpie"

[values]
issue_states = ["open", "closed", "all"]
pr_states = ["open", "closed", "merged", "all"]
upstream_labels = ["ready for maintainer review"]
close_reasons = ["completed", "not planned"]

[callers]
# Read-only by construction: every operation below has writes=False, so this
# caller runs entirely through `vetted-op-read`, which refuses writes before it
# consults this file at all. The three review *submissions*
# (pr-review-approve / -request-changes / -comment) are deliberately absent —
# posting a review stays a confirmed action through `vetted-op`.
"pr-management-code-review" = [
    "viewer",
    "upstream-permission",
    "pr-review-context",
    "pr-files",
    "pr-diff",
    "pr-comments",
    "pr-reviews",
    "pr-checks",
    "pr-list",
    "pr-list-label",
    "pr-search-review-requested",
    "pr-search-mentions",
    "pr-search-reviewed-by",
    "pr-search-team-review-requested",
    "commits-by-path",
    "repo-file",
    "label-list",
    "gql-pr-review-threads",
]

# pr-management-triage reads a whole sweep through `vetted-op-read --save`,
# so the pages land in the workspace for `pr-management triage classify`
# rather than in the agent's context. Reads only: every triage mutation stays a
# confirmed `gh` call.
"pr-management-triage" = [
    "viewer",
    "gql-pr-triage-preflight",
    "gql-pr-triage-open",
    "gql-pr-triage-label",
    "gql-pr-triage-author",
    "gql-pr-triage-review-requested",
    "gql-pr-triage-one",
    "gql-main-recent-failures",
    "runs-action-required",
    "runs-at-head",
    "check-runs",
    "compare-behind",
    "team-members",
    "upstream-permission",
    "pr-view-with-body",
    "gql-pr-liveness",
]

# pr-management-stats is a read-only dashboard: its reads are saved with
# `vetted-op-read --save` for `pr-management stats build`, and it gets no write
# operation at all. Publishing the gist is a confirmed bare `gh gist` call.
"pr-management-stats" = [
    "viewer",
    "gql-pr-stats-open",
    "gql-pr-stats-closed-page",
    "gql-pr-stats-closed-search",
    "team-members",
]

# pr-management-quick-merge screens the ready queue from saved reads. Reads only:
# it never merges; the maintainer runs the printed merge command.
"pr-management-quick-merge" = [
    "viewer",
    "gql-pr-triage-preflight",
    "gql-pr-express-ready",
    "gql-pr-express-one",
    "pr-live-state",
    "gql-pr-review-decision",
    "runs-action-required",
    "pr-diff",
]

# pr-stale-sweep saves the candidate pool and classifies it with
# `pr-management stale-sweep`. Reads only: nudges and closes stay confirmed `gh` calls.
"pr-stale-sweep" = [
    "gql-pr-stale-open",
    "gql-pr-stale-label",
    "gql-pr-stale-one",
    "team-members",
    "upstream-permission",
]

# release-rc-cut emits every release command for the Release Manager and runs
# none itself. Its only GitHub access is reading the upstream tags (Step 0, to
# refuse an RC tag that already exists) and, after the RM confirms it, the
# planning-issue comment (Step 4). `repo-issue-comment` writes, so it runs
# through `vetted-op` and asks every time.
"release-rc-cut" = [
    "tags",
    "repo-issue-comment",
]
