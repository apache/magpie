# Magpie's own vetted-ops policy. Magpie self-adopts the framework, so this is
# the live policy the dispatcher reads — see tools/vetted-ops/README.md.
#
# Nothing here widens what an operation can do; it decides which repository the
# fixed operations point at and which caller may run which of them.

# Body files for comment/review operations must resolve inside this directory,
# which must be owned by you and mode 700.
workspace = "~/.cache/apache-magpie/vetted-ops-workspace"

[repos]
# `tracker` is optional and deliberately unset. The value is not derivable from
# this repository, and pointing tracker operations at a *public* repo would
# publish embargoed content, so it is not guessed. Leaving it out costs nothing
# here: no caller below runs a tracker operation, and the ones that address the
# tracker refuse by name if they are ever granted without it.
#
# To enable them, declare it:
#     tracker = "apache/<tracker>"
upstream = "apache/magpie"

[values]
issue_states = ["open", "closed", "all"]
pr_states = ["open", "closed", "merged", "all"]
# The label taxonomy (docs/labels-and-capabilities.md), listed by name: the
# framework-fix callers label each pull request they open with pr-add-label,
# one label per call, from the sandbox. Labels are never widened by a pattern
# (they reach gh search qualifiers), so a new taxonomy label is added here.
upstream_labels = [
    "ready for maintainer review",
    "capability:authoring",
    "capability:fix",
    "capability:intake",
    "capability:platform",
    "capability:reassess",
    "capability:reconciliation",
    "capability:resolve",
    "capability:review",
    "capability:stats",
    "capability:triage",
    "contract:body-field",
    "contract:change-request",
    "contract:chat",
    "contract:cve-authority",
    "contract:hook-manager",
    "contract:mail-archive",
    "contract:mail-create",
    "contract:mail-source",
    "contract:people",
    "contract:project-metadata",
    "contract:release-staging",
    "contract:report-relay",
    "contract:sbom-pipeline",
    "contract:scan-format",
    "contract:security-cross-ref",
    "contract:security-tracker",
    "contract:source-control",
    "contract:tracker",
    "contract:typed-decision",
    "family:ci",
    "family:contributor-growth",
    "family:cross-family",
    "family:dev",
    "family:docs",
    "family:issue",
    "family:mentoring",
    "family:pairing",
    "family:pr-management",
    "family:release-management",
    "family:repo-health",
    "family:security",
    "family:setup",
    "family:tools",
    "family:utilities",
    "substrate:action-guard",
    "substrate:analytics",
    "substrate:framework-dev",
    "substrate:privacy",
    "substrate:release",
    "substrate:review",
    "substrate:sandbox",
    "substrate:setup",
]
close_reasons = ["completed", "not planned"]

[callers]
# The reads run through `vetted-op-read`, which refuses writes before it
# consults this file at all. The three review *submissions*
# (pr-review-approve / -request-changes / -comment) are deliberately absent —
# posting a review stays a confirmed action through `vetted-op`. The git
# operations at the end are the FIXUP disposition's, run through
# `vetted-op-git` and confirmed one by one.
"pr-management-code-review" = [
    "viewer",
    "upstream-permission",
    "pr-review-context",
    "pr-files",
    "pr-diff",
    "pr-comments",
    "pr-reviews",
    "pr-checks",
    "pr-list",
    "pr-list-label",
    "pr-search-review-requested",
    "pr-search-mentions",
    "pr-search-reviewed-by",
    "pr-search-team-review-requested",
    "commits-by-path",
    "repo-file",
    "label-list",
    "gql-pr-review-threads",
    "team-members",
    "gql-pr-liveness",
    "gql-cr-open",
    "gql-cr-pr",
    "gql-cr-pr-stack",
    "cr-codeowners-github",
    "cr-codeowners-root",
    "cr-codeowners-docs",
    "cr-pr-template",
    "cr-viewer-commits",
    "cr-commit-files",
    "cr-path-commits",
    "cr-commit-pulls",
    # The head commit's check runs, read before an APPROVE to confirm real CI
    # ran there (code-review disposition's secondary check, #2072).
    "check-runs",
    # The workflow runs held at the head commit, which `code-review runs` reads
    # before it proposes releasing them.
    "runs-at-head",
    # FIXUP disposition (classifications/disposition-fixup.md): a worktree at
    # the PR head, commit the fixups, fast-forward the PR's head branch.
    "git-worktree-add",
    "git-worktree-remove",
    "git-stage",
    "git-commit",
    "git-merge-upstream",
    "git-push-pr-head",
]

# pr-management-triage reads a whole sweep through `vetted-op-read --save`,
# so the pages land in the workspace for `pr-management triage classify`
# rather than in the agent's context. Reads only: every triage mutation stays a
# confirmed `gh` call.
"pr-management-triage" = [
    "viewer",
    "gql-pr-triage-preflight",
    "gql-pr-triage-open",
    "gql-pr-triage-label",
    "gql-pr-triage-author",
    "gql-pr-triage-review-requested",
    "gql-pr-triage-one",
    "gql-main-recent-failures",
    "runs-action-required",
    "runs-at-head",
    "check-runs",
    "compare-behind",
    "team-members",
    "upstream-permission",
    "pr-view-with-body",
    "gql-pr-liveness",
    # The recovery journal's checkpoints (pr-triage recovery.md): a fresh read
    # of the PR before each write, and the exact comment after a comment write.
    "pr-triage-recovery-state",
    "pr-triage-comment-receipt",
]

# pr-management-stats is a read-only dashboard: its reads are saved with
# `vetted-op-read --save` for `pr-management stats build`, and it gets no write
# operation at all. Publishing the gist is a confirmed bare `gh gist` call.
"pr-management-stats" = [
    "viewer",
    "gql-pr-stats-open",
    "gql-pr-stats-closed-page",
    "gql-pr-stats-closed-search",
    "team-members",
]

# pr-management-merge-candidates screens the ready queue from saved reads. Reads only:
# it never merges; the maintainer runs the printed merge command.
"pr-management-merge-candidates" = [
    "viewer",
    "gql-pr-triage-preflight",
    "gql-pr-express-ready",
    "gql-pr-express-one",
    "pr-live-state",
    "gql-pr-review-decision",
    "runs-action-required",
    "pr-diff",
]

# pr-stale-sweep saves the candidate pool and classifies it with
# `pr-management stale-sweep`. Reads only: nudges and closes stay confirmed `gh` calls.
"pr-stale-sweep" = [
    "gql-pr-stale-open",
    "gql-pr-stale-label",
    "gql-pr-stale-one",
    "team-members",
    "upstream-permission",
]

# pr-management-stack-review resolves a stack from saved reads. Reads only:
# the rolling stack comment stays a confirmed `gh` call.
"pr-management-stack-review" = [
    "viewer",
    "upstream-permission",
    "gql-stack-of-pr",
    "gql-stack-scan",
    "gql-pr-by-head",
    "pr-checks",
    "pr-comments",
]

# pr-management-thread-mentor reads one thread. Reads only: posting stays a confirmed `gh` call.
"pr-management-thread-mentor" = [
    "viewer",
    "repo-issue-view",
    "pr-view-with-body",
    "pr-comments",
    "team-members",
    "upstream-permission",
]

# reviewer-routing scores the roster from saved reads. Reads only.
"reviewer-routing" = [
    "pr-view-with-body",
    "repo-issue-view",
    "commits-by-path",
    "pr-search-review-requested",
    "repo-file",
]

# release-rc-cut emits every release command for the Release Manager and runs
# none itself. Its only GitHub access is reading the upstream tags (Step 0, to
# refuse an RC tag that already exists) and, after the RM confirms it, the
# planning-issue comment (Step 4). `repo-issue-comment` writes, so it runs
# through `vetted-op` and asks every time.
"release-rc-cut" = [
    "tags",
    "repo-issue-comment",
]

# setup-upstream-fix and setup-override-upstream publish a framework fix from a
# session in this clone, so they act on this policy: worktree, stage, commit,
# push to the operator's fork and open the pull request through vetted-op-git,
# each confirmed. The [git] table below holds project-wide values only:
# checkouts, fork and worktree roots are each maintainer's own, in
# ~/.config/apache-magpie/vetted-ops/operator-git.toml under ["apache/magpie"].
"setup-upstream-fix" = [
    "git-fetch",
    "git-worktree-add",
    "git-worktree-sync",
    "git-worktree-remove",
    "git-rebase",
    "git-cherry-pick",
    "git-merge-upstream",
    "git-switch",
    "git-stage",
    "git-commit",
    "git-push-branch",
    "git-pr-create",
    "pr-add-label",
    "git-delete-fork-branch",
]
"setup-override-upstream" = [
    "git-fetch",
    "git-worktree-add",
    "git-worktree-sync",
    "git-worktree-remove",
    "git-rebase",
    "git-cherry-pick",
    "git-merge-upstream",
    "git-switch",
    "git-stage",
    "git-commit",
    "git-push-branch",
    "git-pr-create",
    "pr-add-label",
    "git-delete-fork-branch",
]

[git]
# Files beyond vetted-op-git's own HARNESS_PATHS that steer the agent outside
# the sandbox, so git-switch writes only upstream's version of them. Keep in
# step with the Edit() denies in .claude/settings.json (a test checks).
harness_paths = [
    "tools/agent-isolation/claude-settings.local.template.json",
    "plugins/magpie-setup/skills/setup/family-mcp-allows.json",
]
