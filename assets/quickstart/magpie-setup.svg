    <text x="26" y="656" fill="#c5c8c6" opacity="0">  Proposed - nothing applied yet:<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5185;0.5195;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="680" fill="#c5c8c6" opacity="0">    1  .claude/settings.json   sandbox on, 14 deny rules<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5490;0.5500;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="704" fill="#c5c8c6" opacity="0">    2  ~/.claude/scripts/      3 hooks and the status line<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.5795;0.5805;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="728" fill="#c5c8c6" opacity="0">    3  ~/.zshrc                source agent-iso.sh<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6100;0.6110;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="776" fill="#c5c8c6" opacity="0">  Apply 1-3? [y/N] y<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6404;0.6414;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="824" fill="#7f9f7f" opacity="0">  ✓ sandbox        filesystem and network confined to this repo<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.6709;0.6719;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="848" fill="#7f9f7f" opacity="0">  ✓ clean env      credentials stripped before the agent starts<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7014;0.7024;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="872" fill="#7f9f7f" opacity="0">  ✓ status line    shows the sandbox state and the Magpie version<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7319;0.7329;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="920" fill="#8a8f94" opacity="0">  Run a skill when you are ready. The first one that needs project<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.7624;0.7634;1" dur="12.5s" repeatCount="indefinite"/></text>
