    <text x="26" y="152" fill="#8a8f94" opacity="0">  Installed  nothing yet<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0610;0.0620;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="176" fill="#8a8f94" opacity="0">  Repo       github.com/acme/toolkit, not adopted<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.0915;0.0925;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="224" fill="#c5c8c6" opacity="0">  Which families? setup and utilities are always in.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1220;0.1230;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="248" fill="#7f9f7f" opacity="0">    [x] setup            install, upgrade, adopt, sandbox<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1525;0.1535;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="272" fill="#7f9f7f" opacity="0">    [x] utilities        author and index your own skills<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.1830;0.1840;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="296" fill="#7f9f7f" opacity="0">    [x] pr-management    you said "triage"<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2135;0.2145;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="320" fill="#8a8f94" opacity="0">    [ ] security  [ ] issue  [ ] release-management  [ ] …<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2440;0.2450;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="368" fill="#c5c8c6" opacity="0">  Run these:<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.2745;0.2755;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="392" fill="#8abeb7" opacity="0">    /plugin marketplace add apache/magpie<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3050;0.3060;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="416" fill="#8abeb7" opacity="0">    /plugin install magpie-setup@apache-magpie<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3355;0.3365;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="440" fill="#8abeb7" opacity="0">    /plugin install magpie-pr-management@apache-magpie<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3660;0.3670;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="488" fill="#8a8f94" opacity="0">  Nothing was written to the repository. That is the finished state.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.3965;0.3975;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="536" fill="#d8a657" opacity="0">  One follow-up that is not optional - these skills read<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4270;0.4280;1" dur="12.5s" repeatCount="indefinite"/></text>
    <text x="26" y="560" fill="#d8a657" opacity="0">  pre-disclosure security content, so sandbox the agent:<animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.4575;0.4585;1" dur="12.5s" repeatCount="indefinite"/></text>
