<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360"
     width="1000" height="360" role="img"
     data-magpie-placeholder="recording pending"
     aria-label="Placeholder for the magpie-mentoring first-run recording — not yet captured">
  <title>magpie-mentoring first run — recording pending</title>
  <desc>Placeholder standing in for the animated SVG recording of the
  magpie-mentoring family's first run. See assets/quickstart/README.md.</desc>

  <rect width="1000" height="360" rx="10" fill="#1d1f21"/>
  <rect x="0" y="0" width="1000" height="34" rx="10" fill="#2b2e31"/>
  <rect x="0" y="24" width="1000" height="10" fill="#2b2e31"/>
  <circle cx="22" cy="17" r="6" fill="#3f4448"/>
  <circle cx="44" cy="17" r="6" fill="#3f4448"/>
  <circle cx="66" cy="17" r="6" fill="#3f4448"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20">
    <text x="40" y="104" fill="#8a8f94">&gt;</text>
    <text x="68" y="104" fill="#c5c8c6">/magpie-mentoring:…</text>
    <rect x="302" y="86" width="11" height="24" fill="#c5c8c6">
      <animate attributeName="opacity" values="1;1;0;0;1"
               dur="1.2s" repeatCount="indefinite"/>
    </rect>

    <text x="40" y="166" fill="#d8a657" font-size="22">recording pending</text>
    <text x="40" y="206" fill="#8a8f94" font-size="17">The real take shows the pre-flight stopping on an unadopted project,</text>
    <text x="40" y="232" fill="#8a8f94" font-size="17">proposing /magpie-setup, and the command working on the retry.</text>
    <text x="40" y="286" fill="#7f9f7f" font-size="17">To replace it:  tools/dev/record-svg.sh mentoring</text>
    <text x="40" y="312" fill="#6a6f74" font-size="15">recipe and conventions: assets/quickstart/README.md</text>
  </g>
</svg>
