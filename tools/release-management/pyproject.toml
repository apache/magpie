[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "release-management"
version = "0.1.0"
description = "Deterministic core of the release-management skills: render every paste-ready command block, draft and comment from release-config's resolved configuration, and leave only judgement to the agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# stdlib-only on purpose: the skills call it through `uv run --project` from an
# adopter's snapshot, and it reads release-config's JSON rather than importing it.
dependencies = []

[project.scripts]
release-management = "release_management.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/release_management"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[dependency-groups]
# The shared toolchain (mypy, pytest, ruff) comes from `magpie-dev`
# (tools/dev), declared once for the whole workspace.
# release-config is a test-only dependency: tests/test_integration.py renders from
# what `release-config load` really prints, so a renamed field fails here.
dev = ["magpie-dev", "release-config"]
