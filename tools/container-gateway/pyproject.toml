[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "container-gateway"
version = "0.1.0"
description = "Per-project policy proxy in front of the podman / docker daemon socket, so sandboxed shell commands can drive containers without reaching the daemon, the machine identity or the host filesystem."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
container-gateway = "container_gateway.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/container_gateway"]

[tool.ruff]
extend = "../dev/shared/ruff.toml"
# Still run by a bare `python3` (a hook, a skill step, or code such a run
# imports), whatever the machine has, so it keeps the 3.11 floor until those
# invocations move to 3.14.
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]

[tool.ty.src]
# The source only, as mypy checked it.
include = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
# A wedged test must dump every thread's stack and fail the run in a
# minute, not sit there until CI's job limit cancels the job with no
# output at all. pytest built-in; no extra dependency.
faulthandler_timeout = 60
addopts = "-ra -q -m 'not integration'"
testpaths = ["tests"]
markers = ["integration: needs a real podman or docker backend; run with -m integration"]

[dependency-groups]
dev = ["magpie-dev"]
