[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "container-gateway"
version = "0.1.0"
description = "Per-project policy proxy in front of the podman / docker daemon socket, so sandboxed shell commands can drive containers without reaching the daemon, the machine identity or the host filesystem."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
container-gateway = "container_gateway.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/container_gateway"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
warn_unused_ignores = true
strict = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q -m 'not integration'"
testpaths = ["tests"]
markers = ["integration: needs a real podman or docker backend; run with -m integration"]

[dependency-groups]
dev = ["magpie-dev"]
