[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maven-artifact-verify"
version = "0.1.0"
description = "Verify locally staged JVM release-candidate artefacts: POM licence set, podling disclaimer, companion -sources/-javadoc jars with signatures and checksums."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# stdlib-only on purpose — argparse, json, re, sys and xml.etree are all
# it needs, and the checks are fully offline by design: a voter with no
# Nexus karma must be able to run them against a staged directory.
dependencies = []

[project.scripts]
maven-artifact-verify = "maven_artifact_verify:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maven_artifact_verify"]

[tool.ruff]
extend = "../dev/shared/ruff.toml"
# Still run by a bare `python3` (a hook, a skill step, or code such a run
# imports), whatever the machine has, so it keeps the 3.11 floor until those
# invocations move to 3.14.
target-version = "py311"
line-length = 160
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B", "SIM"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[dependency-groups]
# The shared toolchain (mypy, pytest, ruff) comes from `magpie-dev`
# (tools/dev), declared once for the whole workspace. The checks run each tool
# via `uv run --directory <member> --project . python -m <tool>` — see
# tools/dev/run-workspace-check.sh.
dev = ["magpie-dev"]
