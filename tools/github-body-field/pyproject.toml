[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "github-body-field"
version = "0.1.0"
description = "Read or rewrite a single `### Field` section of a GitHub issue body without bringing the body into agent context."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# Runtime is stdlib-only; the script shells out to `gh` for GitHub
# access. Keeping the runtime closed lets `uv run` resolve in ms.
dependencies = []

[project.scripts]
body-field = "github_body_field:main"

[tool.hatch.build.targets.wheel]
packages = ["src/github_body_field"]

[tool.ruff]
extend = "../dev/shared/ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B", "SIM"]  # test clarity beats these

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[dependency-groups]
# The shared toolchain (mypy, pytest, ruff) comes from `magpie-dev`
# (tools/dev), declared once for the whole workspace. The checks run each tool
# via `uv run --directory <member> --project . python -m <tool>` — see
# tools/dev/run-workspace-check.sh.
dev = ["magpie-dev"]
