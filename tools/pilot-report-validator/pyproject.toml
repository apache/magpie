[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pilot-report-validator"
version = "0.1.0"
description = "Validate adopter pilot-report files — required frontmatter keys and body sections."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
pilot-report-validate = "pilot_report_validator:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pilot_report_validator"]

[tool.ruff]
extend = "../dev/shared/ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint]
# No annotation requirement here, as mypy had none for this member.
ignore = ["ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[dependency-groups]
dev = ["magpie-dev"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
