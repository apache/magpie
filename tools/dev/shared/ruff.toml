# The ruff settings every workspace member shares. A member's
# `pyproject.toml` pulls them in with
#
#   [tool.ruff]
#   extend = "<relative path>/dev/shared/ruff.toml"
#
# and declares only what is its own on top.
#
# Path-based settings cannot live here. ruff resolves a relative path in an
# extended file against *this* directory, not the member's, so `src`,
# `extend-exclude` and `per-file-ignores` (`"tests/**" = …`) stay in each
# member. A member's `per-file-ignores` table also replaces, rather than
# merges with, one declared here.
#
# Rule selection does merge: a member's `ignore = [...]` adds to the list
# below, and a member's `select` replaces it.

line-length = 110
target-version = "py314"

[lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "RUF",
  # Every function fully annotated, which the workspace's mypy config
  # (`disallow_untyped_defs`, `disallow_incomplete_defs`) required. ruff
  # carries it because ty, the type checker replacing mypy, has no such rule.
  # `ANN401` (no `Any`) is left out: mypy allowed an explicit `Any`.
  "ANN001",
  "ANN002",
  "ANN003",
  "ANN201",
  "ANN202",
  "ANN204",
  "ANN206",
]
ignore = [
  # Line length is ruff-format's job; long strings and URLs stay intact.
  "E501",
]

[lint.flake8-annotations]
# As mypy: an `__init__` with annotated arguments needs no `-> None`.
mypy-init-return = true
