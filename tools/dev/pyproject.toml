# Config carrier, not a package. `tools/dev/` is a directory of standalone
# helper scripts invoked by prek and CI by path, never imported as a library.
# Before this file existed the tree was invisible to ruff, mypy, and pytest:
# the workspace checks iterate `[tool.uv.workspace] members`, and these gates
# — the ones that guard everyone else's changes — were themselves unguarded.
#
# Declaring the tree as one workspace member is the same lightest-fix pattern
# `skills/pyproject.toml` uses: `tools/dev/run-workspace-check.sh` auto-discovers
# which checks apply from the sections below, and the CI matrix emits a
# `pytest (dev)` job for any member with a `[tool.pytest.ini_options]` section.
#
# Script filenames are hyphenated (`check-doc-sync.py`), which is not an
# importable module name, so tests load them through `importlib.util` rather
# than a plain import.

[project]
name = "magpie-dev"
version = "0.1.0"
description = "Framework dev-loop helper scripts invoked by prek and CI."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# The shared static-analysis + test toolchain, declared once. Every other
# workspace member depends on this project in its `dev` group instead of
# repeating the three pins — see the note above `[project.dependencies]` in the
# root pyproject.toml. The scripts themselves are stdlib-only; these are the
# tools that check them and everything else.
dependencies = [
  "mypy>=2.3.0",
  "pytest>=9.1.1",
  "ruff>=0.16.2",
]

# Built as a metadata-only wheel: this project ships no importable module (the
# scripts are hyphenated and invoked by path), but it has to be installable for
# other members to depend on it.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
  "E501",   # line-too-long — the 110-char limit above is already generous
  "RUF003", # ambiguous en dash in a comment — the repo's prose style uses
            # en dashes throughout; rewriting comments to hyphens to satisfy
            # a homoglyph check would make them worse, and these files carry
            # no non-ASCII identifiers, which is what the rule guards
]

[tool.mypy]
python_version = "3.11"
files = ["."]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true
# Scripts invoked by path, not a typed library surface. `check_untyped_defs`
# above still type-checks the bodies, which is where the value is.
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
