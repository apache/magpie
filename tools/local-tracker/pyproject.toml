[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "magpie-local-tracker"
version = "0.1.0"
description = "Local folder-and-markdown security tracker for Apache Magpie (security-tracker contract over a private working copy)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
magpie-local-tracker = "magpie_local_tracker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/magpie_local_tracker"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "W",
  "F",
  "I",
  "B",
  "UP",
  "SIM",
  "C4",
  "RUF",
]
ignore = [
  "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

# No `[dependency-groups] dev` here: this project also ships inside the
# `magpie-vetted-ops` plugin (vetted-ops runs it as a security-tracker backend
# with `uv run --project <plugin>/tools/<this>`), and `magpie-dev` only resolves
# through the workspace root's `[tool.uv.sources]`, which the plugin does not
# ship — a `dev` group would make every plugin invocation fail. The shared
# toolchain still reaches the tests: CI and the workspace checks sync the root
# `dev` group. See tools/vetted-ops/pyproject.toml.
