[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-management"
version = "0.1.0"
description = "Deterministic core of the security skills: pre-filter, dedup batching, tracker body, rollup and ledger rendering, reply parsing and recap, leaving only judgement to the agent."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# stdlib-only on purpose: the skills call it through `uv run --project` from an
# adopter's snapshot. The two workspace members it reuses are stdlib-only too:
# github-body-field (the `### Field` parser) and generate-cve-json (the bot-credit
# policy), so their rules are imported, never copied.
dependencies = ["github-body-field", "generate-cve-json"]

[project.scripts]
security-management = "security_management.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/security_management"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = true
no_implicit_optional = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# The two reused workspace members ship no `py.typed`; the thin wrappers in
# security_management.shared.reuse give their functions types.
[[tool.mypy.overrides]]
module = ["github_body_field.*", "generate_cve_json.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[dependency-groups]
# The shared toolchain (mypy, pytest, ruff) comes from `magpie-dev`
# (tools/dev), declared once for the whole workspace.
dev = ["magpie-dev"]
