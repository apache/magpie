[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "security-management"
version = "0.1.0"
description = "Deterministic core of the security skills: pre-filter, dedup batching, tracker body, rollup and ledger rendering, reply parsing and recap, leaving only judgement to the agent."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
# stdlib-only on purpose: the skills call it through `uv run --project` from an
# adopter's snapshot. The three workspace members it reuses are stdlib-only too:
# github-body-field (the `### Field` parser), generate-cve-json (the bot-credit
# policy) and magpie-vcs (the embargo scrub), so their rules are imported, never copied.
dependencies = ["github-body-field", "generate-cve-json", "magpie-vcs"]

[project.scripts]
security-management = "security_management.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/security_management"]

[tool.ruff]
extend = "../dev/shared/ruff.toml"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "B", "SIM"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]

[dependency-groups]
# The shared toolchain (mypy, pytest, ruff) comes from `magpie-dev`
# (tools/dev), declared once for the whole workspace.
dev = ["magpie-dev"]
