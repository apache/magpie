# Every open upstream PR in the pr-management-stats shape, for
# `gh api graphql --paginate --slurp`: the engagement signals the dashboard's
# is_engaged predicate reads (comments with their raw body, latest reviews,
# review threads, label / ready / draft timeline events) and the changed
# files the CODEOWNERS panel matches. The search connection's pageInfo is the
# only pageInfo in the document.
#
# The builder writes `repo:<upstream>` from policy into $searchQuery itself,
# so this query cannot be pointed at another repository.
query($searchQuery: String!, $endCursor: String) {
  search(query: $searchQuery, type: ISSUE, first: 30, after: $endCursor) {
    pageInfo { hasNextPage endCursor }
    issueCount
    nodes {
      ... on PullRequest {
        number title url isDraft createdAt updatedAt body
        author { login __typename } authorAssociation
        baseRefName reviewDecision
        labels(first: 30) { nodes { name } }
        commits(last: 1) { nodes { commit { oid committedDate } } }
        files(first: 100) { nodes { path } }
        comments(last: 25) {
          nodes { author { login __typename } authorAssociation createdAt body }
        }
        latestReviews(last: 10) {
          nodes { author { login } state submittedAt }
        }
        reviewThreads(first: 30) {
          nodes {
            isResolved
            comments(first: 3) {
              nodes { author { login } authorAssociation createdAt body }
            }
          }
        }
        timelineItems(last: 50, itemTypes: [LABELED_EVENT, READY_FOR_REVIEW_EVENT, CONVERT_TO_DRAFT_EVENT]) {
          nodes {
            __typename
            ... on LabeledEvent { createdAt actor { login } label { name } }
            ... on ReadyForReviewEvent { createdAt actor { login } }
            ... on ConvertToDraftEvent { createdAt actor { login } }
          }
        }
      }
    }
  }
}
