# Every open upstream PR in the shape pr-management-code-review builds the
# "my reviews" queue from: the five signals (review requests, changed files,
# mentions, the viewer's reviews) and the headline fields, for
# `gh api graphql --paginate --slurp`. The pullRequests connection carries the
# document's only pageInfo, which is what `gh --paginate` follows.
#
# $owner / $repo are supplied by the dispatcher from policy, never by the
# caller, so this query cannot be pointed at another repository.
query($owner: String!, $repo: String!, $endCursor: String) {
  repository(owner: $owner, name: $repo) {
    pullRequests(states: OPEN, first: 20, after: $endCursor, orderBy: {field: UPDATED_AT, direction: DESC}) {
      pageInfo { hasNextPage endCursor }
      nodes {
        number
        title
        url
        isDraft
        createdAt
        updatedAt
        headRefOid
        baseRefName
        author { login }
        authorAssociation
        mergeable
        mergeStateStatus
        additions
        deletions
        changedFiles
        bodyText
        labels(first: 30) { nodes { name } }
        reviewRequests(first: 20) {
          nodes {
            requestedReviewer {
              __typename
              ... on User { login }
              ... on Team { slug organization { login } }
            }
          }
        }
        files(first: 100) { totalCount nodes { path } }
        comments(last: 30) { nodes { author { login } bodyText } }
        reviews(last: 30) {
          nodes {
            author { login }
            state
            submittedAt
            bodyText
            commit { oid }
            comments(first: 10) { nodes { bodyText } }
          }
        }
        commits(last: 30) { nodes { commit { message } } }
        reviewThreads(first: 50) { totalCount nodes { isResolved } }
        latest: commits(last: 1) {
          nodes {
            commit {
              statusCheckRollup {
                state
                contexts(first: 50) {
                  nodes {
                    __typename
                    ... on CheckRun { name conclusion status }
                    ... on StatusContext { context state }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
