# pr-management-triage pre-flight: who is the viewer, what may they do on the
# upstream repo, and which labels exist (every page, for `--paginate`; the
# labels connection carries the document's only pageInfo).
#
# $owner / $repo are supplied by the dispatcher from policy, never by the
# caller, so this query cannot be pointed at another repository.
query($owner: String!, $repo: String!, $endCursor: String) {
  viewer { login }
  repository(owner: $owner, name: $repo) {
    viewerPermission
    labels(first: 100, after: $endCursor) {
      pageInfo { hasNextPage endCursor }
      nodes { name }
    }
  }
}
