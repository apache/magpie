# One upstream PR in the shape pr-stale-sweep classifies on, the same as one
# node of pr-stale-search.graphql.
#
# $owner / $repo are supplied by the dispatcher from policy, never by the
# caller, so this query cannot be pointed at another repository. The StalePR
# fragment must stay identical to the one in pr-stale-search.graphql.
query($owner: String!, $repo: String!, $number: Int!) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $number) { ...StalePR }
  }
}

fragment StalePR on PullRequest {
  number
  title
  url
  id
  createdAt
  updatedAt
  isDraft
  body
  mergeable
  baseRefName
  headRefName
  headRefOid
  author { login }
  authorAssociation
  labels(first: 30) { nodes { name } }
  commits(last: 20) {
    totalCount
    nodes { commit { oid committedDate message } }
  }
  head: commits(last: 1) {
    nodes { commit { oid committedDate } }
  }
  reviewThreads(first: 20) {
    totalCount
    nodes {
      isResolved
      comments(last: 3) {
        nodes { author { login } authorAssociation url bodyText createdAt }
      }
    }
  }
  latestReviews(first: 20) {
    nodes { state author { login } authorAssociation submittedAt body }
  }
  comments(last: 20) {
    nodes { author { login } authorAssociation url createdAt body bodyText }
  }
  timelineItems(itemTypes: [LABELED_EVENT, UNLABELED_EVENT], last: 10) {
    nodes {
      __typename
      ... on LabeledEvent { createdAt label { name } }
      ... on UnlabeledEvent { createdAt label { name } }
    }
  }
}
