# pr-management-stack-review: the open upstream PRs whose head is one branch —
# the walk from a stack's base down to the default branch.
#
# $owner / $repo are supplied by the dispatcher from policy, never by the
# caller, so this query cannot be pointed at another repository.
query($owner: String!, $repo: String!, $head: String!) {
  repository(owner: $owner, name: $repo) {
    pullRequests(headRefName: $head, states: OPEN, first: 10) {
      nodes {
        number title url baseRefName
        stackEntry { position }
        stack { number size }
      }
    }
  }
}
