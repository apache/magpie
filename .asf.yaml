# https://cwiki.apache.org/confluence/display/INFRA/git+-+.asf.yaml+features
---
github:
  description: "Agent-assisted maintainership and development framework for Apache projects — Triage, Mentoring, Drafting (agent-authored fixes with human review), and Pairing (developer-side dev-cycle) skills shipping; Agentic Autonomous (auto-merge) on the roadmap."
  homepage: "https://magpie.apache.org/"
  labels:
    # Note that GitHub only supports <=20 labels/topics per repo! Pipeline
    # will fail if you add more.
    - apache
    - security
    - cve
    - vulnerability-management
    - vulnerability-disclosure
    - agent-skills
    - claude-code
    - automation
  features:
    issues: true
    projects: true
    wiki: false
    discussions: true

  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false

  pull_requests:
    # Lets a maintainer approve a PR and have it merge once the required
    # status checks pass, instead of returning to merge it by hand after CI.
    # It changes nothing about what gates `main`.
    allow_auto_merge: true
    allow_update_branch: true
    del_branch_on_merge: true

  # External triage collaborators — GitHub IDs that get triage rights
  # without being added to the apache org. ASF Infra caps this list
  # at 10 entries; exceptions need a vp-infra@apache.org request.
  collaborators:
    # Non-ASF-members named in MISSION.md → "involved as
    # collaborators on the project from day one":
    - johnslavik         # Bartosz Sławecki
    # Also named in MISSION.md's non-ASF-members section (Apache
    # Airflow committers):
    - shahar1            # Shahar Epstein (Airflow committer)
    - vincbeck           # Vincent Beck (Airflow committer)
    - bugraoz93          # Buğra Öztürk (Airflow committer)

  # Disable GitHub Copilot completely on this repo. The framework's
  # review workflow is human-driven (`pr-management-code-review`
  # skill + maintainer review) and the agent-assisted authoring loop
  # is Claude-Code-based; Copilot's per-PR comments and code-review
  # ruleset duplicate / contradict both. The explicit `enabled:
  # false` is required to actively remove the Copilot automatic-
  # code-review ruleset if it was ever previously configured (per
  # the asf.yaml `copilot_code_review` directive); this is the only
  # lever asfyaml exposes for the Copilot integration today, and
  # toggling it off is what "disable Copilot completely" reduces to
  # in this config.
  copilot_code_review:
    enabled: false

  # No `environments:` block by design — asfyaml's environment
  # handler currently passes `prevent_self_review` as a kwarg to
  # `Repository.create_environment()`, which the PyGithub version
  # asfyaml ships does not accept ("Repository.create_environment()
  # got an unexpected keyword argument 'prevent_self_review'"). The
  # block is harmless to omit while no release workflow targets a
  # deployment environment; re-add (with the `atr-release`
  # protected-branches scaffold for ASF Trusted Releases) once the
  # asfyaml / PyGithub interaction is fixed upstream and a release
  # workflow exists that needs the environment.

  # Merge rules for `main` live in the two rulesets below, not in classic
  # `protected_branches`. ASF Infra reconciles them within a few minutes of
  # a merge to main (asfyaml features `rulesets` and `protected_branches`).
  # The layout follows apache/airflow's `.asf.yaml`.
  #
  # `protected_branches: ~` keeps the classic protection off: GitHub
  # enforces it whatever a ruleset's bypass list says, so it would block
  # the committer override below.
  protected_branches: ~

  rulesets:
    # The required checks, which committers can bypass when merging a PR,
    # through GitHub's "merge without waiting for requirements" option,
    # when CI is stuck or broken for reasons the PR does not cause. It is
    # an escape hatch, not a way of working: use it only when the failing
    # check is unrelated to the change, and say why in the PR. Every
    # bypass is recorded in the PR timeline and the repository's rule
    # insights. Nobody can push to `main` directly anyway: the "Branch
    # protection" ruleset below requires a PR for every change and has no
    # bypass.
    #
    # Raw Rulesets API payload, because the convenience syntax can only
    # name teams as bypass actors and GitHub refuses the `magpie-committers`
    # team ("must be part of the ruleset source or owner organization").
    # The bypass actor is instead the Write repository role (actor_id 4):
    # on this repository only committers hold it, granted by ASF Infra from
    # the project's LDAP group, so it follows committer changes with no
    # update here. The external `collaborators` above get the Triage role,
    # not Write, so they cannot bypass.
    #
    # Listed checks MUST run on every PR against `main`: a path-filtered
    # workflow that does not post a status would block the PR. Excluded for
    # that reason: `asf-allowlist-check` (paths: `.github/**`) and `lint
    # .claude/settings.json against baseline` from sandbox-lint (see
    # `paths:` in `.github/workflows/sandbox-lint.yml`). CodeQL is not
    # required either: the repository publishes no runtime artefacts, so
    # per-PR CodeQL gating adds noise rather than value; `codeql.yml` still
    # runs on every PR for visibility. The checks are not pinned to the
    # GitHub Actions app: asfyaml passes a raw `integration_id` as a string,
    # which the API rejects.
    - name: "Require CI on main"
      target: branch
      enforcement: active
      conditions:
        ref_name:
          include:
            - "refs/heads/main"
          exclude: []
      bypass_actors:
        - actor_id: 4
          actor_type: RepositoryRole
          bypass_mode: always
      rules:
        - type: required_status_checks
          parameters:
            # Do not require the PR branch to be up to date with `main`:
            # with strict checks every merge forces a rebase of every open PR.
            strict_required_status_checks_policy: false
            required_status_checks:
              # zizmor: GitHub Actions security lint.
              - context: "zizmor"
              # prek: the static checks across the repository, including
              # the lychee link check.
              - context: "prek"
              # tests-ok: the umbrella job over the per-project pytest
              # matrix in tests.yml, so a matrix change needs no
              # `.asf.yaml` change.
              - context: "tests-ok"
    # The rest of `main`'s rules, with no bypass: the override is for CI,
    # not for skipping review threads, deleting the branch or rewriting
    # history.
    - name: "Branch protection"
      type: branch
      branches:
        includes:
          - main
      # Squash is the only merge button, so history stays linear.
      required_linear_history: true
      # Block merge until every review thread is resolved: with no
      # approval requirement (below) an unresolved thread is the signal
      # that a reviewer's point is still open.
      required_conversation_resolution: true
      # `required_pull_request_reviews` must be present whenever
      # `required_conversation_resolution` is set: asfyaml builds one
      # pull-request rule from both, and GitHub refuses that rule (and so
      # the whole ruleset) without the review fields.
      #
      # APPROVAL REQUIREMENT TEMPORARILY LIFTED. After becoming a
      # Top-Level Project every PR into `main` needed one committer
      # approval (#818). It is lifted while the marketplace installation
      # and the reworked permission handling land as many small, fast
      # iterations; this is a time-boxed exception, not a governance
      # change. Restore by setting `required_approving_review_count` to
      # 1. `dismiss_stale_reviews: false` keeps an approval across a
      # rebase or a fixup push; `require_code_owner_reviews` stays off
      # because there is no CODEOWNERS file.
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: false
      # No signed-commit requirement: contributors without GPG/SSH
      # signing could not contribute.
      #
      # Branch deletion and force pushes stay blocked, with no bypass:
      # `restrict_deletion` and `restrict_force_push` default to on.

notifications:
  # Magpie is a Top-Level Project with its own mailing lists. All
  # commit / PR / issue / discussion traffic routes to the project's
  # own `commits@magpie.apache.org` list. (During the bootstrap phase
  # the framework ran under the Airflow PMC umbrella and its events
  # rode the Airflow PMC's lists; with TLP status Magpie now has its
  # own `commits@` and the schemes below point at it.)
  #
  # Routing:
  #   - jobs            → jobs@    (CI run notifications)
  #   - everything else → commits@
  #
  # ASF Infra defaults any *unset* notification field to
  # `dev@<project>.apache.org`. The four `_status` / `_comment`
  # schemes (`issues_status`, `issues_comment`, `pullrequests_status`,
  # `pullrequests_comment`) are set explicitly to `commits@` here —
  # **not** left to that default — so PR review comments, CI-status
  # flips, and label / milestone changes go to the same list as the
  # lifecycle events rather than landing on `dev@magpie.apache.org`.
  # Per the ASF asf.yaml schema
  # (https://github.com/apache/infrastructure-asfyaml/blob/main/asfyaml/feature/notifications.py
  # `VALID_NOTIFICATION_SCHEMES`), if Infra adds a new scheme, set
  # it explicitly in the same change to keep the `dev@` default
  # suppressed.
  commits:               commits@magpie.apache.org
  issues:                commits@magpie.apache.org
  issues_status:         commits@magpie.apache.org
  issues_comment:        commits@magpie.apache.org
  pullrequests:          commits@magpie.apache.org
  pullrequests_status:   commits@magpie.apache.org
  pullrequests_comment:  commits@magpie.apache.org
  discussions:           commits@magpie.apache.org
