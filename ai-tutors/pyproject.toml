[project]
name = "ai-tutors"
version = "0.1.0"
description = "Lesson tutor prompts plus the knowledge-base injector that rebuilds them from docs/education/."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
# stdlib-only — argparse + re + pathlib are all the injector needs.
dependencies = []

# Not an installable package: `inject-knowledge-base.py` is a standalone
# script run from the repo, and the lesson prompts are markdown. This member
# exists so the workspace's ruff / mypy / pytest checks cover the injector and
# its tests — before this, `test_inject_knowledge_base.py` was the only test
# file outside `tools/` and no CI job collected it.
[tool.uv]
package = false

[tool.ruff]
extend = "../tools/dev/shared/ruff.toml"
# Still run by a bare `python3` (a hook, a skill step, or code such a run
# imports), whatever the machine has, so it keeps the 3.11 floor until those
# invocations move to 3.14.
target-version = "py311"

[tool.ruff.lint]
# No annotation requirement here, as mypy had none for this member.
ignore = ["ANN"]

[tool.ty.src]
# The two Python files; the rest of the tree is prose and prompts.
include = ["inject-knowledge-base.py", "test_inject_knowledge_base.py"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["."]

[dependency-groups]
# The shared toolchain (mypy, pytest, ruff) comes from `magpie-dev`
# (tools/dev), declared once for the whole workspace. The checks run each tool
# via `uv run --directory <member> --project . python -m <tool>` — see
# tools/dev/run-workspace-check.sh.
dev = ["magpie-dev"]
