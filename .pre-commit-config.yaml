---
default_stages: [commit, push]
default_language_version:
  python: python3
  # Node 22 is the current active LTS line. markdownlint-cli2 ≥ v0.18
  # (and its string-width dependency from v6 onward) uses the regex
  # `/v` flag, which requires Node ≥ 20 to parse. The previous Node
  # 18.6.0 pin matched the framework's pre-PR-#18 tooling baseline
  # but is incompatible with the markdownlint-cli2 v0.22.1 rev
  # pinned below.
  #
  # Bumped 22.11.0 -> 22.13.0: markdownlint-cli2's transitive dep
  # `@eslint/js@10.0.1` declares engines `^20.19.0 || ^22.13.0 || >=24`,
  # so the old 22.11.0 pin failed `npm install` with EBADENGINE. 22.13.0
  # is the lowest 22.x that satisfies it.
  #
  # Bumped 22.13.0 -> 22.20.0: ava@7.0.0 declares engines
  # `^20.19 || ^22.20 || ^24.12 || >=25`; 22.13.0 fails EBADENGINE.
  # 22.20.0 is the lowest 22.x that satisfies both constraints.
  node: 22.20.0
minimum_prek_version: '0.3.5'
repos:
  - repo: meta
    hooks:
      - id: identity
        name: Print input to the static check hooks for troubleshooting
      - id: check-hooks-apply
        name: Check if all hooks apply to the repository
  - repo: https://github.com/thlorenz/doctoc
    rev: v2.5.0
    hooks:
      - id: doctoc
        name: Add TOC for Markdown and RST files
        files: ^.+\.(md|rst)$
        # Skip agent-facing skill definitions across every skill-dir layout
        # (.agents/skills canonical home, plus the .claude/skills and
        # .github/skills relays, and the skills/ source): their YAML
        # frontmatter must be the first thing in the file, which is
        # incompatible with doctoc inserting a TOC block at the top. Also skip skill-evals fixture and
        # README files, and the spec-loop specs/prompts (YAML-frontmatter
        # specs and short single-purpose prompts, same rationale as skills)
        # — short docs that don't warrant a TOC.
        # Skip the PR template — GitHub pre-populates a new PR description
        # with the template verbatim, so a TOC block becomes per-PR noise the
        # contributor has to delete by hand.
        exclude: ^(\.claude/skills/.*|\.agents/skills/.*|\.github/skills/.*|skills/.*|tools/cve-tool-vulnogram/generate-cve-json/SKILL\.md|tools/skill-evals/.*|tools/spec-loop/.*|\.github/PULL_REQUEST_TEMPLATE\.md)$
        args:
          - "--maxlevel"
          - "3"
  # Stamp an SPDX Apache-2.0 licence identifier into Markdown files so the
  # Apache RAT licence check (.github/workflows/rat.yml) sees an approved
  # header on every scanned file. Markdown carries no comment header by
  # convention, so RAT would otherwise flag it as unapproved. Plain
  # Markdown gets an HTML-comment header on line 1; files with YAML front
  # matter get a `# SPDX-License-Identifier` comment as the first line
  # *inside* the front matter, so line 1 stays `---` and no new key is
  # introduced for a front-matter validator to reject. The hook fixes files
  # in place and fails the commit when it changes one (the end-of-file-fixer
  # convention), so the contributor re-stages the now-stamped file. The
  # `exclude` mirrors `.rat-excludes`: the third-party-licence detection
  # fixtures deliberately contain non-Apache licence text and must not be
  # stamped Apache-2.0.
  - repo: local
    hooks:
      - id: add-license-headers
        name: Stamp SPDX licence header into Markdown
        language: system
        entry: tools/dev/add-license-headers.py
        files: \.md$
        exclude: ^tools/skill-evals/evals/pr-management-code-review/step-4-third-party-license/fixtures/.*$
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        name: Check that merge conflicts are not being committed
      - id: detect-private-key
        name: Detect if private key is added to the repository
      # The next three hooks are *fixers*: they open every matched file
      # in read-write mode (to normalise it in place) before checking
      # whether a fix is even needed. The secure-agent sandbox
      # write-denies three tracked path sets — the agent's own config
      # (`.claude/settings.json`), the self-adoption skill relays
      # (`.claude/skills/*` symlinks), and the plugin hook scripts
      # (`hooks/`) — because agents must never modify them. A hook script
      # runs automatically on a harness event, so an agent that could
      # rewrite one could arrange to run arbitrary code on the next
      # session start; the deny is the point, not an oversight. So on
      # `prek run --all-files` (which `agent-pre-commit.sh` and the CI
      # mirror both run) the read-write `open()` on those paths is denied
      # and the whole run aborts, even though the files need no fix.
      # Exclude them: `.claude/settings.json` is gated by the
      # sandbox-lint baseline, the skill symlinks are validated by
      # `symlink-lint`, and `hooks/check-upgrade.sh` is checked for
      # existence and correct wiring by `check-family-plugins.py`, so
      # none of them loses coverage by skipping EOF / whitespace /
      # line-ending normalisation here. This keeps prek a single
      # invocation that runs cleanly in-sandbox with no bypass.
      - id: end-of-file-fixer
        name: Make sure that there is an empty line at the end
        exclude: &sandbox_write_denied ^(\.claude/(settings\.json|skills/)|hooks/)
      - id: mixed-line-ending
        name: Detect if mixed line ending is used (\r vs. \r\n)
        exclude: *sandbox_write_denied
      - id: trailing-whitespace
        name: Remove trailing whitespace at end of line
        exclude: *sandbox_write_denied
  # markdownlint — catches structurally-bad markdown. Config in
  # `.markdownlint.json` enables only the rules that catch real bugs
  # (broken anchors via MD051, dangling link references via MD053);
  # style choices the existing docs already settled stay off.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        name: markdownlint
        files: \.md$
        # Skip skill-evals fixture markdown: report.md / system-prompt.md /
        # user-prompt-template.md are test data containing raw code diffs and
        # CLI snippets (leading-underscore identifiers, `*args`, `--- /dev/null`,
        # etc.). The eval runner reads them as plain text, never rendered, so
        # prose rules like MD037 only ever false-positive on them. Suite
        # README.md files are NOT excluded — they are real docs.
        exclude: ^tools/skill-evals/evals/.+/fixtures/.+\.md$
  # typos — fast spell-checker. Allowlist is `.typos.toml`.
  #
  # Override the default args (which include `--write-changes`) so
  # the hook never silently rewrites files; CI surfaces typos as
  # errors instead.
  #
  # `pass_filenames: false` + the trailing `.` arg → typos walks the
  # repo itself instead of being handed the file list, the same shape
  # as the `lychee` hook below. That is a memory requirement, not a
  # preference: typos' peak RSS scales with the number of paths passed
  # to one invocation (~1.2 MB per path), and prek splits the file list
  # across roughly `cpu_count` invocations. On a 4-vCPU runner the ~4.9k
  # tracked files arrive as ~1.2k-path chunks (~925 MB each); on the
  # 1-vCPU `ubuntu-slim` runner they arrive as a single invocation that
  # peaks at ~5.7 GB and is OOM-killed. prek reports that as a bare
  # `exit code: 1` with no output — a signal-killed process has no exit
  # code of its own — which reads like a hook failure with a missing
  # message rather than the kill it is. Walking costs ~21 MB flat,
  # whatever the core count.
  #
  # typos honours .gitignore while walking, and uv writes a `*`
  # .gitignore inside `.venv`, so a synced workspace stays out of the
  # walk: it covers the same files the list did.
  - repo: https://github.com/crate-ci/typos
    rev: v1.50.0
    hooks:
      - id: typos
        name: typos
        args: [--force-exclude, .]
        pass_filenames: false
  # lychee — link checker (was the standalone `link-check.yml`
  # workflow; converted to this prek hook). Validates cross-file links,
  # `#anchor` fragments, and external URLs across markdown / rst /
  # `.md.j2`. Config in `.lychee.toml`.
  #
  # `language: rust` with `additional_dependencies: [cli:lychee]`
  # means prek installs lychee itself (cargo install from crates.io)
  # into an isolated, cached hook env — the hook does NOT depend on a
  # locally-installed lychee, and the prek CI workflow needs no extra
  # install step. Unpinned, so it tracks the **latest** lychee; the
  # exact version is resolved when the hook env is first built and then
  # held stable by the prek env cache until the cache busts (keyed on
  # this file). lychee must be >= 0.24 for `.lychee.toml`'s
  # `include_fragments = "anchor-only"` enum-string schema.
  #
  # `pass_filenames: false` + the trailing `.` arg → lychee scans the
  # whole repo (so a renamed link target is caught no matter which
  # file references it); `files:` only gates *whether* the whole-repo
  # scan fires, i.e. it runs when any doc file changes and always on
  # `prek run --all-files` (CI). External-URL results are cached for
  # 7 days (`.lycheecache`, gitignored).
  - repo: local
    hooks:
      - id: lychee
        name: lychee (link check)
        language: rust
        entry: lychee
        args: ["--config", ".lychee.toml", "--no-progress", "."]
        additional_dependencies: ["cli:lychee"]
        files: \.(md|rst|j2)$
        pass_filenames: false
  # Local placeholder linter — catches hardcoded references like
  # `apache/airflow` or `Apache Airflow` that should be the
  # placeholder tokens `<upstream>` / `<PROJECT>` per
  # `AGENTS.md#placeholder-convention-used-in-skill-files`.
  - repo: local
    hooks:
      - id: check-placeholders
        name: check-placeholders
        language: system
        entry: tools/dev/check-placeholders.sh
        files: ^(skills/.*|tools/.*)\.(md|sh|py|yaml|yml|toml)$
        pass_filenames: false
  # Vendor-neutrality score — regenerate the block embedded in
  # docs/vendor-neutrality.md from repository metadata (tool README
  # `**Vendor:**` / `**Harness:**` fields, skill frontmatter, the
  # privacy-llm registry) so the published number never drifts from the
  # tree. `--in-place` rewrites the block and exits non-zero when it
  # changed, so a stale doc fails the commit and the contributor re-stages
  # the regenerated file — the doctoc pattern, but for a computed score.
  # `pass_filenames: false`: the scorer always reads the whole tree; the
  # `files:` filter only gates *whether* the regen fires (and it always
  # runs on `prek run --all-files` in CI). Deterministic and offline, so
  # the same tree always yields the same block. Tool + tests + scoring
  # rule live in tools/vendor-neutrality-score (README + tests).
  - repo: local
    hooks:
      - id: vendor-neutrality-score
        name: Regenerate the vendor-neutrality score in docs/vendor-neutrality.md
        language: system
        entry: uv run --project tools/vendor-neutrality-score vendor-neutrality-score --in-place
        files: ^(tools/[^/]+/README\.md|tools/privacy-llm/models\.md|tools/vendor-neutrality-score/.*|skills/[^/]+/SKILL\.md|docs/vendor-neutrality\.md)$
        pass_filenames: false
  # AI-tutor knowledge-base sync — fail when a `docs/education/` source
  # page (or a training lesson) changes without regenerating the tutor
  # prompts in `ai-tutors/`. `--check` prints the stale prompts and exits
  # non-zero; the contributor reruns `python3
  # ai-tutors/inject-knowledge-base.py` (no flag) to regenerate and
  # re-stages. `pass_filenames: false`: the script always scans every
  # lesson; the `files:` filter only gates *whether* the check fires (and
  # it always runs on `prek run --all-files` in CI). Deterministic and
  # offline. Script + pytest suite live in ai-tutors/.
  - repo: local
    hooks:
      - id: ai-tutors-kb-check
        name: Check ai-tutors prompts are in sync with docs/education
        language: system
        entry: python3 ai-tutors/inject-knowledge-base.py --check
        files: ^(ai-tutors/|docs/education/)
        pass_filenames: false
  # Self-adoption symlink hygiene: reject cyclic symlinks, misdirected
  # skill relays, and incomplete self-adoption symlink sets. Fires on
  # changes under `skills/` or any agent-skills tree (always on
  # `prek run --all-files`). Rules, rationale, and the pytest suite live
  # in tools/symlink-lint (README + tests).
  - repo: local
    hooks:
      - id: symlink-lint
        name: symlink-lint
        language: system
        entry: python3 tools/symlink-lint/src/symlink_lint/__init__.py
        files: ^(\.(agents|claude|github|kiro)/skills/.*|skills/.*)$
        types_or: [symlink, file]
        pass_filenames: false
  # Release-archive guard: build the source archive exactly as the release
  # does (git archive of the export tree, honouring .gitattributes
  # export-ignore) and reject any symlink a safe extractor refuses — a
  # dangling link (its target got export-ignored) or a chain (target is
  # itself a symlink, which ATR's upload validator rejects as "outside the
  # extraction directory"). This is what -1'd an RC upload; the hook fails
  # the commit before an RC is cut. Re-fires whenever .gitattributes, any
  # symlink, or the skills/agent-view tree that the archive ships changes.
  - repo: local
    hooks:
      - id: symlink-lint-archive
        name: symlink-lint (release archive)
        language: system
        entry: python3 tools/symlink-lint/src/symlink_lint/__init__.py --archive
        files: ^(\.gitattributes|\.(agents|claude|github|kiro)/skills/.*|skills/.*|projects/_template/.*)$
        types_or: [symlink, file]
        pass_filenames: false
  # Marketplace-plugin consistency guard. Validates that every plugin is
  # properly defined and in sync with the skills' `family:` frontmatter (the
  # source of truth): the all-in-one `magpie` manifest + its upgrade-hook
  # script, each per-family manifest (name / skills / description), every
  # `.claude-plugin/marketplace.json` entry resolving to a matching, uniquely
  # named plugin.json, and each family's skills present as single-hop symlinks
  # into the shared skills/ tree. Catches a new skill, a changed family, a stale
  # symlink, or a malformed manifest.
  #
  # Runs as `--fix`, so the hook *regenerates* rather than merely reporting: the
  # generated tree is a pure function of the frontmatter and `pyproject.toml`'s
  # version, so there is nothing for a contributor to decide when it drifts, and
  # a check-only hook just made them run the fixer by hand. prek fails the run
  # when a hook modifies files, so drift still stops the commit — it now arrives
  # already corrected and staged-ready instead of as an instruction.
  - repo: local
    hooks:
      - id: check-family-plugins
        name: check-family-plugins (marketplace plugins vs frontmatter)
        language: system
        entry: python3 tools/dev/check-family-plugins.py --fix
        files: ^(skills/.*/SKILL\.md|plugins/.*|\.claude-plugin/(marketplace|plugin)\.json|\.codex-plugin/plugin\.json|\.agents/plugins/marketplace\.json|(plugin|marketplace)\.json|gemini-extension\.json|apm\.yml|pyproject\.toml|hooks/check-upgrade\.sh)$
        pass_filenames: false
  # The shared setup pre-flight every skill runs before it acts. It cannot be
  # a hook: on most harnesses *no code runs at all* when a plugin is installed
  # or upgraded (AP1 defines no hook component; Claude Code's SessionStart hook
  # is wired only into the all-in-one plugin), so the check has to be
  # instructions the agent reads on invocation. It cannot be an include either:
  # a family plugin symlinks `skills/<skill>` and AP1 forbids a symlink
  # escaping the plugin root, so a shared file would be unreachable from the
  # install shape most adopters use. That leaves one source and 65 generated
  # copies, which is exactly the drift this hook exists to prevent — edit
  # `tools/dev/preflight-block.md` and let `--fix` propagate it. The `setup`
  # family is exempt: those skills perform the setup the block asks for.
  - repo: local
    hooks:
      - id: check-skill-preflight
        name: check-skill-preflight (shared pre-flight block in every SKILL.md)
        language: system
        entry: python3 tools/dev/check-skill-preflight.py --fix
        files: ^(skills/[^/]+/SKILL\.md|tools/dev/preflight-block\.md)$
        pass_filenames: false
  # Documentation claims that must track the tree. Four mechanical checks,
  # each added after the drift it catches was found by hand:
  #   - every tools/spec-loop/specs/*.md is listed in BOTH index files
  #     (overview.md and README.md) — ten specs were absent from both,
  #     including per-family specs and one added four PRs earlier;
  #   - README.md's family table "N skills" cells match live `family:`
  #     frontmatter;
  #   - docs/modes.md's *Modes at a glance* Skill-count column matches live
  #     `mode:` frontmatter (the validator's modes-doc rule checks section
  #     membership but reads only the mode and status columns, so the counts
  #     were unguarded);
  #   - bare "N skills" totals in docs/setup/marketplaces.md match the
  #     catalogue;
  #   - every script in tools/dev/ is named in tools/dev/README.md — these are
  #     the framework's own gates, and an undocumented one is invisible to the
  #     next contributor deciding whether it applies to their change.
  # None of these break anything when wrong, which is exactly why they rot:
  # they are numbers a human must remember to update while thinking about
  # something else.
  - repo: local
    hooks:
      - id: check-doc-sync
        name: check-doc-sync (spec indexes + declared skill counts)
        language: system
        entry: python3 tools/dev/check-doc-sync.py
        files: ^(skills/[^/]+/SKILL\.md|tools/spec-loop/specs/.*\.md|README\.md|docs/modes\.md|docs/setup/marketplaces\.md|tools/dev/.*)$
        pass_filenames: false
  # Workspace-membership guard. The single source of truth for
  # which Python projects get pre-commit hooks + the CI pytest
  # matrix is the `[tool.uv.workspace] members` array in the root
  # `pyproject.toml`. If a new `tools/<name>/pyproject.toml`
  # appears without being added to that array, both surfaces
  # silently skip it — the very drift bug the workspace refactor
  # was meant to prevent.
  #
  # It also verifies every declared member's tests actually run. Both
  # the CI matrix and the workspace sweep key off the presence of
  # `[tool.pytest.ini_options]`, so a project can carry a full tests/
  # directory and never be executed by anything — no red tick, because
  # no job. Reported: tests with no config (never run), config with no
  # tests (a green job that collected nothing), and neither. A project
  # that should not be tested declares `[tool.magpie.checks] skip =
  # ["pytest"]` rather than being quietly absent.
  #
  # Re-fires on any member pyproject, the root pyproject, or any test
  # file — adding or deleting tests changes the answer.
  - repo: local
    hooks:
      - id: check-workspace-members
        name: check-workspace-members (membership + tests actually run)
        language: system
        entry: tools/dev/check-workspace-members.py
        files: ^((tools/[^/]+(/[^/]+)?|ai-tutors|skills)/pyproject\.toml|pyproject\.toml|.*/tests?/.*\.py|.*/test_[^/]+\.py|.*_test\.py)$
        pass_filenames: false
  # Workspace-level static checks. Iterate over every uv-workspace
  # member declared in the root `pyproject.toml`'s
  # `[tool.uv.workspace] members` list via
  # `tools/dev/run-workspace-check.sh`. The driver auto-discovers
  # which checks apply per member (e.g. only runs `mypy` on members
  # with a `[tool.mypy]` section in their pyproject) and honours an
  # opt-out `[tool.magpie.checks] skip = [...]` block per member.
  #
  # Adding a new uv-managed tool requires NO edit here — append its
  # path to `[tool.uv.workspace] members` in the root pyproject and
  # all four hooks pick it up automatically.
  - repo: local
    hooks:
      - id: workspace-ruff-check
        name: ruff check (workspace)
        language: system
        entry: tools/dev/run-workspace-check.sh ruff "ruff check"
        files: ^(tools/[^/]+(/[^/]+)?/(src|tests|pyproject\.toml)|pyproject\.toml|tools/dev/run-workspace-check\.sh)
        pass_filenames: false
      - id: workspace-ruff-format
        name: ruff format (workspace)
        language: system
        entry: tools/dev/run-workspace-check.sh ruff-format "ruff format --check"
        files: ^(tools/[^/]+(/[^/]+)?/(src|tests|pyproject\.toml)|pyproject\.toml|tools/dev/run-workspace-check\.sh)
        pass_filenames: false
      - id: workspace-mypy
        name: mypy (workspace)
        language: system
        entry: tools/dev/run-workspace-check.sh mypy mypy
        files: ^(tools/[^/]+(/[^/]+)?/(src|tests|pyproject\.toml)|pyproject\.toml|tools/dev/run-workspace-check\.sh)
        pass_filenames: false
      - id: workspace-pytest
        name: pytest (workspace)
        language: system
        entry: tools/dev/run-workspace-check.sh pytest "pytest --color=yes"
        files: ^(tools/[^/]+(/[^/]+)?/(src|tests|pyproject\.toml)|pyproject\.toml|tools/dev/run-workspace-check\.sh)
        pass_filenames: false

  # Validate `skills/**`, every `tools/<name>/README.md`, and the
  # `docs/labels-and-capabilities.md` taxonomy via the
  # `skill-and-tool-validate` CLI. Re-fires on validator-source changes so
  # rule updates get re-applied. The doc and tool-README triggers exist so
  # the capability-sync check catches drift between docs and live source.
  # `--project` (not `--directory`) so CWD stays at repo root.
  - repo: local
    hooks:
      - id: skill-and-tool-validate
        name: skill-and-tool-validate (skills, tools, capability sync)
        language: system
        entry: uv run --project tools/skill-and-tool-validator skill-and-tool-validate
        files: ^(skills/.*\.md|tools/[^/]+/README\.md|docs/labels-and-capabilities\.md|tools/skill-and-tool-validator/(src|pyproject\.toml))
        pass_filenames: false

  # Validate `tools/spec-loop/specs/` frontmatter and required body sections
  # via the `spec-validate` CLI. Re-fires on spec-source changes so rule
  # updates get re-applied. `--project` (not `--directory`) so CWD stays at
  # repo root; the directory argument is passed directly to the CLI so it
  # scans the full specs tree even when only one file changed.
  - repo: local
    hooks:
      - id: spec-validate
        name: spec-validate (spec-loop specs frontmatter + sections)
        language: system
        entry: uv run --project tools/spec-validator spec-validate tools/spec-loop/specs/
        files: ^(tools/spec-loop/specs/.*\.md|tools/spec-validator/(src|pyproject\.toml))
        pass_filenames: false
