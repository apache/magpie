---
name: "GitHub Actions Security Analysis"

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `ready_for_review` is not in the default set (opened / synchronize /
    # reopened). It is here so that marking a draft ready starts the checks —
    # which is what makes the draft PR from `bump-dev-version.yml` usable, since
    # GitHub raises no events for anything `GITHUB_TOKEN` opens.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      ref:
        description: >-
          Commit or branch to check instead of the caller's default. Set by
          `bump-dev-version.yml`, which verifies its candidate commit on a
          temporary branch before promoting it to `main`; empty everywhere else,
          which leaves `actions/checkout` on its normal behaviour.
        type: string
        required: false
        default: ""

permissions: {}

jobs:
  zizmor:
    name: "zizmor"
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: read
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      # zizmor runs from the root uv workspace's `dev` group rather than
      # through `zizmorcore/zizmor-action`. The action's `action.sh` runs
      # the tool with `docker pull` + `docker run` and aborts with
      # "Cannot run this action without Docker"; `ubuntu-slim` jobs are
      # themselves containers with no Docker daemon, so the job failed
      # before zizmor was ever invoked. Installing the CLI from PyPI also
      # puts its version under the root lockfile and the
      # `[tool.uv] exclude-newer` cooldown, same as prek.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
        # A distinct cache slot per job. `setup-uv` derives its key from the
        # runner, arch and Python version only, so every job that enables the
        # cache computes the *same* key and they race when they run
        # concurrently — "Unable to reserve cache with key …, another job may be
        # creating this cache", and the loser saves nothing. `cache-suffix`
        # splits them, which also keeps each slot scoped to the dependency set
        # that job actually installs.
          cache-suffix: "zizmor"
      - name: "Install zizmor"
        # `--no-install-workspace` — zizmor is a leaf tool that imports
        # nothing from this repo, so building the workspace's ~34 member
        # packages to run it would be pure cost on a 1-vCPU runner.
        run: uv sync --group dev --no-install-workspace
      - name: "Run zizmor"
        # `--persona regular` matches the action's default (and its
        # `advanced-security: false`): report findings on the console and
        # exit non-zero, with no SARIF upload to code scanning.
        # GH_TOKEN enables the audits that need the REST API (the
        # `actions: read` permission above); without it zizmor skips them
        # with a warning instead of failing.
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run zizmor --config .zizmor.yml --persona regular .
