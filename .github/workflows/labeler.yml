#
# Labels pull requests from the files they touch, and passes those labels on
# to the issues each pull request closes or refers to. The mapping is
# `.github/labeler.yml`, generated by tools/dev/generate-labeler-config.py
# from tool READMEs (`contract:*` / `substrate:*`) and skill frontmatter
# (`family:*` / `capability:*`); see docs/labels-and-capabilities.md.
#
# Privilege boundary — read this before changing any trigger.
#
# This workflow holds a token that can label pull requests and issues, so it
# never checks out, builds or runs anything from a pull request. It does not
# use pull_request_target. Its triggers are signals only:
#   - workflow_run fires when labeler-signal.yml (an unprivileged
#     `pull_request` run that does nothing) completes. It always runs this file
#     from the default branch, which is the property that makes it safe, and
#     labels the pull request the moment it is opened or pushed to.
#   - schedule is a daily safety net: it labels any open pull request that
#     still has no `family:*` label (a run that failed or was dropped).
#   - workflow_dispatch labels one pull request, or runs the safety net.
# The only value taken from the triggering event is the head SHA, checked to be
# 40 hex characters and used solely to find the pull request among the open
# ones. A pull request's body is read only to extract issue numbers, which are
# checked to be issues before any label is added; no text from it reaches a
# command. The labeler action reads the changed-file list and the config (from
# the default branch) through the API.
#
# Who decides which issues get labels: the pull request's body names them, so
# for a pull request opened by someone outside the project anyone could point
# this token at any issue. Labels are therefore passed on immediately only when
# the author is an OWNER, MEMBER or COLLABORATOR; an outside contributor's pull
# request passes them on once a maintainer has merged it.
#
# Labels are only ever added. A label a maintainer removes is re-added only
# when the pull request is pushed to again and still matches the rule.
---
name: "Pull request labels"
"on":
  workflow_run:  # zizmor: ignore[dangerous-triggers] -- default-branch code, no PR input; see header
    workflows: ["Labeler signal"]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: "Label this pull request number (blank: every open pull request without a family label)"
        required: false
        type: string
permissions: {}
concurrency:
  group: pull-request-labels
  cancel-in-progress: false
jobs:
  label:
    name: Label pull requests and their issues
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read  # read .github/labeler.yml and the pull requests' changed files
      pull-requests: write  # add labels to pull requests
      issues: write  # add the same labels to the issues they close or refer to
    steps:
      - name: Select pull requests
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_INPUT: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          # Dependency and version bumps implement no capability: skip bot authors.
          open_prs() {
            gh pr list --repo "$REPO" --state open --limit 200 \
              --json number,headRefOid,author,labels --jq "$1"
          }
          case "$EVENT" in
            workflow_run)
              if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "::error::unexpected head SHA"; exit 1
              fi
              prs=$(open_prs ".[] | select(.headRefOid == \"$HEAD_SHA\" and (.author.is_bot | not)) | .number")
              if [ -z "$prs" ]; then  # closed: the merged pull request this commit belongs to
                prs=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" \
                  --jq '.[] | select(.merged_at != null and (.user.type != "Bot")) | .number')
              fi
              ;;
            workflow_dispatch)
              if [ -n "$PR_INPUT" ]; then
                if ! [[ "$PR_INPUT" =~ ^[0-9]+$ ]]; then
                  echo "::error::pr must be a pull request number"; exit 1
                fi
                prs=$PR_INPUT
              else
                prs=$(open_prs '.[] | select((.author.is_bot | not) and ([.labels[].name | startswith("family:")] | any | not)) | .number')
              fi
              ;;
            *)
              prs=$(open_prs '.[] | select((.author.is_bot | not) and ([.labels[].name | startswith("family:")] | any | not)) | .number')
              ;;
          esac
          echo "pull requests: ${prs:-none}" | tr '\n' ' '
          {
            echo "prs<<EOF"
            if [ -n "$prs" ]; then echo "$prs"; fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - if: steps.select.outputs.prs != ''
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13  # v7.0.0
        with:
          pr-number: ${{ steps.select.outputs.prs }}

      - name: Pass the labels on to linked issues
        if: steps.select.outputs.prs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PRS: ${{ steps.select.outputs.prs }}
        run: |
          set -euo pipefail
          for pr in $PRS; do
            [[ "$pr" =~ ^[0-9]+$ ]] || continue
            # The body chooses the issues, so only a project member's pull request,
            # or a merged one, may label them.
            read -r assoc merged < <(gh api "repos/$REPO/pulls/$pr" --jq '"\(.author_association) \(.merged)"')
            case "$assoc" in
              OWNER|MEMBER|COLLABORATOR) ;;
              *)
                if [ "$merged" != "true" ]; then
                  echo "#$pr: author is $assoc and the pull request is not merged; its issues are labelled on merge"
                  continue
                fi
                ;;
            esac
            labels=$(gh pr view "$pr" --repo "$REPO" --json labels \
              --jq '[.labels[].name | select(test("^(family|capability|contract|substrate):"))] | join(",")')
            [ -n "$labels" ] || continue
            # Issues the pull request closes (GitHub's own link) and issues its body
            # refers to (#N, or this repository's issue URL). Only numbers are kept.
            closing=$(gh pr view "$pr" --repo "$REPO" --json closingIssuesReferences \
              --jq '.closingIssuesReferences[].number')
            mentioned=$(gh pr view "$pr" --repo "$REPO" --json body --jq '.body // ""' \
              | grep -oE "(^|[^&0-9A-Za-z_/])#[0-9]+|github\.com/${REPO}/issues/[0-9]+" \
              | grep -oE '[0-9]+$' || true)
            for issue in $(printf '%s\n%s\n' "$closing" "$mentioned" | grep -E '^[0-9]+$' | sort -un | head -20); do
              [ "$issue" = "$pr" ] && continue
              kind=$(gh api "repos/$REPO/issues/$issue" --jq 'if .pull_request then "pull" else "issue" end' 2>/dev/null || true)
              [ "$kind" = "issue" ] || continue
              echo "#$pr -> issue #$issue: $labels"
              gh issue edit "$issue" --repo "$REPO" --add-label "$labels"
            done
          done
