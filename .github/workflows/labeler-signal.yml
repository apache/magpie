---
# A doorbell for labeler.yml, and nothing more.
#
# A `pull_request` run holds no privileges, so this one does nothing at all:
# it has no permissions, checks nothing out and runs no code. Its only effect
# is that it completes, which fires labeler.yml's `workflow_run` trigger in the
# default branch's context, where the labeler reads the pull request through
# the API and labels it. `edited` is included so a pull request that starts
# referring to an issue passes its labels on to that issue, and `closed` so a
# merge passes an outside contributor's labels on (see labeler.yml).
name: "Labeler signal"
"on":
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited, closed]

permissions: {}

jobs:
  signal:
    runs-on: ubuntu-slim
    timeout-minutes: 2
    steps:
      - name: Signal the labeler
        run: echo "labeler.yml runs on this workflow's completion"
