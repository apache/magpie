#
# Moves the dev stamp on `main`, on request.
#
# The marketplace is served straight from `main`, and `claude plugin update`
# compares version strings rather than commit SHAs. While the stamp sits still,
# an adopter running that command is told they are already current no matter how
# far behind they are — see docs/setup/marketplace.md.
#
# Run from the Actions tab: **bump dev version** -> *Run workflow*. It is
# deliberately manual rather than on-merge, because the judgement of *when a
# bump is wanted* is not mechanical — it is wanted before pointing anyone at
# `claude plugin update`, before announcing a change adopters should take, or
# when merged work has piled up behind a stale stamp, and not on the merges in
# between.
#
# Who can run it: `workflow_dispatch` is restricted by GitHub to accounts with
# write access to the repository, so this is committers-only without the
# workflow having to check anything. The run is attributed to whoever pressed
# the button — they are named as `Co-Authored-By` on the commit, and the
# Actions run records them as the actor.
#
# SHAPE — why this is six jobs rather than one.
#
#   prepare  ->  branch carrying the signed candidate commit
#   prek / tests / rat / zizmor  ->  the real workflows, called with `ref`
#   open-pr  ->  open the pull request once those pass
#   cleanup  ->  delete the branch when anything above failed
#
# The bump is not "only a version string": it also regenerates fourteen
# manifests and the lockfile, any of which can come out wrong. So the candidate
# is checked before it becomes a pull request, and a failed check deletes the
# branch instead of leaving a broken PR for someone to work out.
#
# The checks are `uses:` of the workflows themselves, not copies of their
# steps, so they cannot drift from what a PR gets. `pre-commit.yml`,
# `tests.yml`, `rat.yml` and `zizmor.yml` each grew a `workflow_call` trigger
# and a `ref` input for this; that input is empty on every other trigger.
#
# WHY THE PULL REQUEST IS A DRAFT. GitHub raises no `pull_request` events for
# anything done with `GITHUB_TOKEN`, so a PR opened from here starts no checks
# of its own, and the checks this workflow ran are attached to the run's own
# commit rather than to the PR head — evidence in the run log, not green ticks
# on the PR. Left as a ready PR it would sit forever on "N of N required status
# checks are expected".
#
# Opening it as a draft turns that into a normal gesture: marking a draft ready
# raises `pull_request: ready_for_review`, which *is* a real event because a
# human does it. `pre-commit.yml`, `tests.yml`, `rat.yml` and `zizmor.yml` list
# that type explicitly — it is not in the default set — so pressing *Ready for
# review* starts the required checks against the PR head, exactly as an ordinary
# PR gets them. Review the diff, mark it ready, let the checks run, merge.
---
name: bump dev version

on:  # yamllint disable-line rule:truthy
  workflow_dispatch:

permissions: {}

jobs:
  prepare:
    name: Build the candidate commit
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      # Creating the temporary branch and committing the candidate onto it.
      contents: write
    outputs:
      branch: ${{ steps.candidate.outputs.branch }}
      version: ${{ steps.candidate.outputs.version }}
      changed: ${{ steps.bump.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The commit is created through GitHub's API rather than `git push`,
          # so the job never needs the checkout's credentials on disk.
          persist-credentials: false
          # The bump reads and rewrites the tip; no history is needed.
          fetch-depth: 1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      # The documented steps, unchanged: edit `project.version`, then let
      # check-family-plugins propagate it to every manifest and `uv lock`
      # restamp the lockfile. `uv run` supplies the Python; `ubuntu-slim` is
      # minimal and a system interpreter is not worth assuming.
      - name: Bump the stamp and regenerate the manifests
        id: bump
        run: |
          set -euo pipefail
          uv run --project tools/dev python tools/dev/bump-dev-version.py
          version=$(uv run --project tools/dev python tools/dev/bump-dev-version.py --print)
          uv run --project tools/dev python tools/dev/check-family-plugins.py --fix
          uv lock
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Stamp is already current; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit the candidate onto a temporary branch
        if: steps.bump.outputs.changed == 'true'
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.bump.outputs.version }}
          HEAD_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="chore/bump-dev-version-${RUN_ID}"

          # Attribute the bump to the maintainer who ran the workflow. The
          # commit's *author* is whoever the token authenticates as — with
          # GITHUB_TOKEN that is the Actions bot, and the mutation offers no way
          # to set it — so the credit goes in a trailer instead. The address is
          # GitHub's noreply form, which is stable and does not publish an
          # address the account has chosen to keep private.
          actor_name=$(gh api "users/$ACTOR" --jq '.name // .login')
          coauthor="$actor_name <${ACTOR_ID}+${ACTOR}@users.noreply.github.com>"

          {
            echo "chore: bump dev version to $VERSION"
            echo
            echo "Move the dev stamp so adopters' \`claude plugin update\` picks up the"
            echo "work merged since the previous stamp. The marketplace is served from"
            echo "\`main\` and the update check compares version strings, so a frozen"
            echo "suffix is a silent no-op: an adopter running that command is told they"
            echo "are already current while sitting behind."
            echo
            echo "Run from the Actions tab by @${ACTOR}. Generated by"
            echo ".github/workflows/bump-dev-version.yml with the documented steps: bump"
            echo "\`project.version\` in \`pyproject.toml\`, then"
            echo "\`tools/dev/check-family-plugins.py --fix\` and \`uv lock\` to propagate"
            echo "to every manifest. The stamp is UTC at minute resolution."
            echo
            echo "Co-Authored-By: $coauthor"
          } > "$RUNNER_TEMP/bump-message.txt"

          # The branch has to exist before the mutation can commit onto it. It
          # is a throwaway: `promote` fast-forwards `main` onto it and deletes
          # it, `cleanup` deletes it if anything fails.
          gh api "repos/$REPO/git/refs" \
            -f "ref=refs/heads/$branch" -f "sha=$HEAD_SHA" >/dev/null

          # Committed through GitHub's API, not `git commit`: the commit comes
          # back signed by GitHub and shows as Verified, with no key material in
          # CI.
          uv run --project tools/dev python tools/dev/gh-signed-commit.py \
            --branch "$branch" \
            --expected-head-oid "$HEAD_SHA" \
            --message-file "$RUNNER_TEMP/bump-message.txt" \
            --repo "$REPO"

          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # The same four workflows a pull request runs, against the candidate. Called
  # rather than copied, so they cannot drift from what a PR gets.
  prek:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: $/.github/workflows/pre-commit.yml
    with:
      ref: ${{ needs.prepare.outputs.branch }}

  tests:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: $/.github/workflows/tests.yml
    with:
      ref: ${{ needs.prepare.outputs.branch }}

  rat:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: $/.github/workflows/rat.yml
    with:
      ref: ${{ needs.prepare.outputs.branch }}

  zizmor:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    uses: $/.github/workflows/zizmor.yml
    with:
      ref: ${{ needs.prepare.outputs.branch }}

  open-pr:
    name: Open the bump pull request
    needs: [prepare, prek, tests, rat, zizmor]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
          VERSION: ${{ needs.prepare.outputs.version }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body=$(cat <<EOF
          Moves the dev stamp to \`$VERSION\` so adopters' \`claude plugin update\` picks
          up the work merged since the previous stamp. The marketplace is served from
          \`main\` and the update check compares version strings, so a frozen suffix is a
          silent no-op — see [\`docs/setup/marketplace.md\`](docs/setup/marketplace.md).

          Requested from the Actions tab by @$ACTOR, who is credited on the commit. The
          commit is signed by GitHub and the candidate was checked before this PR was
          opened — prek, tests, rat and zizmor all passed in [the run that produced it]($RUN_URL).

          Those runs are attached to that workflow run rather than to this PR, so the
          required checks here start out unstarted: GitHub raises no events for anything
          \`GITHUB_TOKEN\` does. **Press *Ready for review* to start them** — that raises
          a real event, and the check workflows listen for it.

          Opened by [\`bump-dev-version.yml\`](.github/workflows/bump-dev-version.yml).
          EOF
          )
          # Draft on purpose — see the note at the top of this file. Marking it
          # ready is what starts the required checks.
          url=$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --draft \
            --title "chore: bump dev version to $VERSION" \
            --body "$body")
          echo "Opened $url" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    name: Drop the temporary branch
    needs: [prepare, prek, tests, rat, zizmor, open-pr]
    # Only when something above did not succeed. On the happy path the branch
    # is the pull request's head and must stay. Without this a failed check
    # leaves an orphan candidate branch behind on every run.
    if: always() && needs.prepare.outputs.changed == 'true' && contains(needs.*.result, 'failure')
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete the candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ needs.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          if [[ -n "$BRANCH" ]]; then
            gh api "repos/$REPO/git/refs/heads/$BRANCH" -X DELETE || true
            echo "Checks failed; candidate branch $BRANCH deleted and no PR opened." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
