---
name: Skill token counts
on:
  pull_request:
    paths: &measurement_paths
      - 'skills/**/SKILL.md'
      - 'tools/dev/preflight-block.md'
      - 'tools/skill-token-count/**'
      - 'docs/mode-economics.md'
      - 'uv.lock'
      - '.pre-commit-config.yaml'
      - '.github/workflows/skill-token-count.yml'
      - '.github/workflows/pre-commit.yml'
  push:
    branches: [main]
    paths: *measurement_paths
permissions: {}
jobs:
  measure:
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          enable-cache: true
      - name: Prepare verified tokenizer vocabulary
        run: uv run --locked --project tools/skill-token-count skill-token-count --prepare-tokenizer
      - name: Check committed token measurements
        run: uv run --locked --project tools/skill-token-count skill-token-count --check
