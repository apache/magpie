---
name: tests

on:  # yamllint disable-line rule:truthy
  pull_request:
    # `ready_for_review` is not in the default set (opened / synchronize /
    # reopened). It is here so that marking a draft ready starts the checks —
    # which is what makes the draft PR from `bump-dev-version.yml` usable, since
    # GitHub raises no events for anything `GITHUB_TOKEN` opens.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Discover workspace members from the root pyproject.toml so the
  # pytest matrix below is data-driven — adding a new tool is a
  # one-line edit to `[tool.uv.workspace] members` and the matrix
  # picks it up automatically.
  members:
    name: list-workspace-members
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      batches: ${{ steps.list.outputs.batches }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Full history so the PR path-filter below can diff the PR
          # head against its merge base. Harmless on push events.
          fetch-depth: 0
      - id: list
        # `tools/dev/ci-pytest-batches.py` picks the members and groups
        # them into jobs; its docstring has the rules. In short:
        #
        # - Applicability mirrors `tools/dev/run-workspace-check.sh`: a
        #   member with `[tool.pytest.ini_options]` and no
        #   `[tool.magpie.checks] skip = [..., "pytest"]`.
        # - Path filter (PRs only): a member is picked when its own
        #   Python source/test files changed. On push to `main`, and when
        #   a shared build input changes (root `pyproject.toml`,
        #   `uv.lock`, the helpers, this workflow), every member is.
        # - Grouping: most of a job is setup, so up to six members get a
        #   job each (named after the member, as before); more are split
        #   into at most eight jobs balanced by test size.
        #
        # An empty selection skips the `pytest` job, which `tests-ok`
        # treats as a pass (see below).
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Write the changed-file list to a file rather than exporting it
          # as an env var: a repo-wide PR (e.g. a licence-header sweep) can
          # list thousands of paths, and putting that into the environment
          # overflows the exec arg/env size limit — `python3` then dies with
          # "Argument list too long" (exit 126). A file path stays small.
          if [ "${EVENT}" = "pull_request" ]; then
            changed_file="${RUNNER_TEMP}/changed-files.txt"
            git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "${changed_file}"
            batches=$(python3 tools/dev/ci-pytest-batches.py --changed-file "${changed_file}")
          else
            batches=$(python3 tools/dev/ci-pytest-batches.py)
          fi
          echo "batches=${batches}" >> "$GITHUB_OUTPUT"
          echo "pytest jobs:"
          echo "${batches}" | python3 -m json.tool

  # The pytest matrix, one entry per job from the `members` job. A
  # pull request touching a few projects gets one job per project, so
  # per-project pass/fail shows in the checks list; a full run batches
  # them, and each batch job prints a group and a summary row per
  # member. The `prek` workflow still exercises pytest as a hook, so
  # this workflow is the visible signal — not the gate.
  pytest:
    name: "pytest (${{ matrix.batch.name }})"
    runs-on: ubuntu-slim
    needs: members
    # Guard against an empty selection. When the path filter selects no
    # members (a PR that changed no project's Python), the batches output
    # is `[]`; feeding an empty array to `matrix` makes GitHub mark this
    # job `failure` ("matrix vector does not contain any values"), not
    # `skipped` — which would fail `tests-ok`. Skipping the job on an
    # empty list yields the `skipped` result `tests-ok` treats as a pass.
    if: ${{ needs.members.outputs.batches != '[]' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # At most eight batches, but a PR can still pick six single
      # jobs; ASF Infra policy caps a workflow at 20 concurrent jobs and
      # recommends 15: https://infra.apache.org/github-actions-policy.html
      max-parallel: 15
      matrix:
        batch: ${{ fromJSON(needs.members.outputs.batches) }}
    # GitHub Actions log viewer renders ANSI colour escapes; without
    # an attached TTY most tools default to monochrome. `FORCE_COLOR`
    # is the de-facto signal honoured by uv, ruff, mypy, and pytest's
    # own auto-detection. Belt-and-braces — the explicit
    # `--color=yes` on the pytest invocation below covers tools that
    # don't read `FORCE_COLOR`.
    env:
      FORCE_COLOR: "1"
      PY_COLORS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # uv brings its own Python and reads each project's
      # `pyproject.toml` + the workspace `uv.lock`. Minimum uv
      # version is enforced by the root `pyproject.toml`'s
      # `[tool.uv] required-version`.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          enable-cache: true
          # One slot per batch: each syncs only its own members, so a shared
          # key would race and store the wrong contents. A batch's key is
          # stable across runs (the split is deterministic), and a single
          # member's key is its name.
          cache-suffix: "tests-${{ matrix.batch.key }}"
      - name: Sync the batch's members (and ruff / mypy / pytest from the root dev group)
        # Dev-group deps live in the root pyproject (`[dependency-groups]
        # dev`) and only land in the shared workspace `.venv` when an
        # explicit `--group dev` sync runs. One `--package` per member
        # installs that member, its `[project.scripts]` entry points and
        # what it declares — workspace siblings included — and nothing
        # else, so a test that imports a sibling it does not declare
        # fails here rather than passing by accident. `--frozen`: the
        # lock is the input, never rewritten in CI.
        env:
          MEMBER_PACKAGES: ${{ matrix.batch.packages }}
        run: |
          args=()
          for package in ${MEMBER_PACKAGES}; do
            args+=(--package "${package}")
          done
          uv sync --frozen --group dev "${args[@]}"
      - name: Run pytest
        # `--directory` (not `--project`) — both move uv's project
        # context, but `--directory` also changes cwd, which pytest
        # needs because each project's `pyproject.toml` declares
        # `testpaths = ["tests"]` relative to its own root. No
        # `--group` flag here because the sync above already
        # installed the dev tools into the shared workspace venv.
        #
        # `-n auto` runs each member's tests in parallel (`pytest-xdist`,
        # from the shared `magpie-dev` toolchain).
        #
        # Every member of the batch runs even after one fails; the job
        # fails at the end, and the summary table names which member did.
        env:
          MEMBER_PATHS: ${{ matrix.batch.paths }}
        run: |
          failed=()
          {
            echo "| Project | pytest |"
            echo "|---|---|"
          } >> "${GITHUB_STEP_SUMMARY}"
          for path in ${MEMBER_PATHS}; do
            name="${path##*/}"
            echo "::group::pytest (${name})"
            if uv run --directory "${path}" pytest --color=yes -n auto; then
              result="passed"
            else
              result="**failed**"
              failed+=("${name}")
            fi
            echo "::endgroup::"
            echo "| \`${name}\` | ${result} |" >> "${GITHUB_STEP_SUMMARY}"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::pytest failed for: ${failed[*]}"
            exit 1
          fi

  # Umbrella status check. `.asf.yaml`'s `required_status_checks`
  # cannot use patterns or wildcards (GitHub's branch-protection and
  # rulesets APIs both require exact context names), so a matrix job
  # with N entries would otherwise force N `.asf.yaml` lines that
  # must be kept in lock-step with the matrix. This single
  # `tests-ok` job is the only pytest-related context required by
  # branch protection — it passes iff every entry in the `pytest`
  # matrix above passed. Adding, renaming, or removing matrix
  # entries no longer touches `.asf.yaml`.
  tests-ok:
    name: tests-ok
    runs-on: ubuntu-slim
    needs: pytest
    # `always()` — without it, this job would be skipped (not
    # failed) when an upstream matrix entry fails, and a skipped
    # required-check is treated as missing by branch protection,
    # which leaves the PR mergeable. Run unconditionally and assert
    # on the result instead.
    if: always()
    steps:
      - name: Assert all pytest matrix entries succeeded
        # `success` — every selected member passed.
        # `skipped` — the path filter selected no members (the PR
        #   changed no project's Python source/test files), so there
        #   was nothing to run; that is a pass, not a gap.
        # Anything else (`failure` / `cancelled`) fails the gate.
        run: |
          result="${{ needs.pytest.result }}"
          if [ "${result}" != "success" ] && [ "${result}" != "skipped" ]; then
            echo "pytest matrix result: ${result}"
            exit 1
          fi
          echo "pytest gate satisfied (matrix result: ${result})"
