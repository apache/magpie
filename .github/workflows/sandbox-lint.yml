#
# Implements mitigation M.29 from
# `docs/security/threat-model.md`: every change to the agent-host
# sandbox configuration in `.claude/settings.json` must be paired with
# a matching update to the canonical baseline at
# `tools/sandbox-lint/expected.json`, and the resulting configuration
# must satisfy the security invariants encoded in the linter.
---
name: sandbox-lint

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - ".claude/settings.json"
      # Each contributor's own layer, never tracked: a change here means
      # someone committed one, and the job must run to refuse it.
      - ".claude/settings.local.json"
      - "tools/agent-isolation/claude-settings.local.template.json"
      - "plugins/magpie-setup/skills/setup/family-mcp-allows.json"
      - ".gemini/**"
      - "tools/sandbox-lint/**"
      - ".github/workflows/sandbox-lint.yml"
  push:
    branches: [main]
    paths:
      - ".claude/settings.json"
      # Each contributor's own layer, never tracked: a change here means
      # someone committed one, and the job must run to refuse it.
      - ".claude/settings.local.json"
      - "tools/agent-isolation/claude-settings.local.template.json"
      - "plugins/magpie-setup/skills/setup/family-mcp-allows.json"
      - ".gemini/**"
      - "tools/sandbox-lint/**"
      - ".github/workflows/sandbox-lint.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sandbox-lint:
    name: lint .claude/settings.json against baseline
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      FORCE_COLOR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true
        # A distinct cache slot per job. `setup-uv` derives its key from the
        # runner, arch and Python version only, so every job that enables the
        # cache computes the *same* key and they race when they run
        # concurrently — "Unable to reserve cache with key …, another job may be
        # creating this cache", and the loser saves nothing. `cache-suffix`
        # splits them, which also keeps each slot scoped to the dependency set
        # that job actually installs.
          cache-suffix: "sandbox-lint"
      # Sync the workspace so `sandbox-lint` (a workspace member's
      # `[project.scripts]` entry) ends up on the shared venv's PATH.
      # `--all-packages` is required — without it `uv sync` only
      # installs the root project's deps, and the root has
      # `package = false` so no member packages (and no member
      # script entry-points) get installed.
      - name: Sync workspace
        run: uv sync --all-packages --group dev
      # `sandbox-lint` is the workspace member's CLI entry point;
      # after sync it is available directly via `uv run` from the
      # repo root, which is what the linter expects so
      # `.claude/settings.json` and `tools/sandbox-lint/expected.json`
      # resolve relative to cwd.
      # `.claude/settings.local.json` is each contributor's own layer over the
      # committed floor, reconciled from the local template. Claude Code
      # loads it for everyone who checks the repository out, and a local
      # scalar overrides the floor's (`sandbox.enabled: false`), but CI lints
      # only the floor and the template. Refuse a committed copy outright.
      - name: Refuse a committed .claude/settings.local.json
        run: |
          if git ls-files --error-unmatch .claude/settings.local.json >/dev/null 2>&1; then
            echo "::error file=.claude/settings.local.json::.claude/settings.local.json is each contributor's own layer and must not be committed. Shared settings go in the floor (.claude/settings.json) or the local template (tools/agent-isolation/claude-settings.local.template.json); remove the file with 'git rm --cached .claude/settings.local.json'."
            exit 1
          fi
      - name: Run sandbox-lint
        run: uv run sandbox-lint
      - name: Check Gemini sandbox and policy profile
        run: uv run sandbox-lint --gemini .gemini
